version: 2

unit_tests:
  - name: access_requirement_revisions_decode_historical_settings
    description: "Decodes historical metadata, eligibility, document, IDU, 2FA, and expiration settings; preserves false, zero, and negative values; and returns null for missing or unrecognized settings. Requirement type comes from concreteType when present and otherwise the XML root tag."
    model: stg_synapse__access_requirement_revision
    given:
      - input: source('rds', 'access_requirement_revision')
        format: sql
        rows: |
          select
              100 as owner_id,
              0 as number,
              10 as modified_by,
              1767225600000 as modified_on,
              to_binary('', 'HEX') as serialized_entity
          union all
          select
              100, 1, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 2, 10, 1767225600000,
              to_binary('1f8b0800000000000213b3c92f4ad72b4e4c4f4dcacccf4b2d29cf2fca2ed62b4a2dc8d7cbcd4f49cdd1f34dcc034aa6383a87382627a7161707a516966616a5e6a6e695d8d9e853a019003e77256e79000000', 'HEX')
          union all
          select
              100, 3, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 4, 10, 1767225600000,
              null::binary
          union all
          select
              100, 5, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 6, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 7, 10, 1767225600000,
              to_binary('', 'HEX')
    expect:
      rows:
        - {access_requirement_id: 100, access_requirement_version: 0, access_requirement_name: Requirement 100 revision 0, access_requirement_type: ACTAccessRequirement, access_type: DOWNLOAD, is_two_fa_required: false, expiration_period: 86400000, is_certified_user_required: false, is_validated_profile_required: false, is_duc_required: false, is_irb_approval_required: false, are_other_attachments_required: false, is_idu_required: false, is_idu_public: false}
        - {access_requirement_id: 100, access_requirement_version: 1, access_requirement_name: Requirement 100 revision 1, access_requirement_type: ManagedACTAccessRequirement, access_type: PARTICIPATE, is_two_fa_required: true, expiration_period: 172800000, is_certified_user_required: true, is_validated_profile_required: true, is_duc_required: true, is_irb_approval_required: true, are_other_attachments_required: true, is_idu_required: true, is_idu_public: true}
        - {access_requirement_id: 100, access_requirement_version: 2, access_requirement_name: null, access_requirement_type: ManagedACTAccessRequirement, access_type: null, is_two_fa_required: null, expiration_period: null, is_certified_user_required: null, is_validated_profile_required: null, is_duc_required: null, is_irb_approval_required: null, are_other_attachments_required: null, is_idu_required: null, is_idu_public: null}
        - {access_requirement_id: 100, access_requirement_version: 3, access_requirement_name: Requirement 100 revision 3, access_requirement_type: ManagedACTAccessRequirement, access_type: DOWNLOAD, is_two_fa_required: null, expiration_period: null, is_certified_user_required: null, is_validated_profile_required: null, is_duc_required: null, is_irb_approval_required: null, are_other_attachments_required: null, is_idu_required: null, is_idu_public: null}
        - {access_requirement_id: 100, access_requirement_version: 4, access_requirement_name: null, access_requirement_type: null, access_type: null, is_two_fa_required: null, expiration_period: null, is_certified_user_required: null, is_validated_profile_required: null, is_duc_required: null, is_irb_approval_required: null, are_other_attachments_required: null, is_idu_required: null, is_idu_public: null}
        - {access_requirement_id: 100, access_requirement_version: 5, access_requirement_name: "R\xE9sum\xE9", access_requirement_type: ManagedACTAccessRequirement, access_type: DOWNLOAD, is_two_fa_required: true, expiration_period: 0, is_certified_user_required: false, is_validated_profile_required: true, is_duc_required: false, is_irb_approval_required: true, are_other_attachments_required: false, is_idu_required: true, is_idu_public: false}
        - {access_requirement_id: 100, access_requirement_version: 6, access_requirement_name: Requirement 100 revision 6, access_requirement_type: ManagedACTAccessRequirement, access_type: PARTICIPATE, is_two_fa_required: false, expiration_period: -1, is_certified_user_required: true, is_validated_profile_required: false, is_duc_required: true, is_irb_approval_required: false, are_other_attachments_required: true, is_idu_required: false, is_idu_public: true}
        - {access_requirement_id: 100, access_requirement_version: 7, access_requirement_name: null, access_requirement_type: ManagedACTAccessRequirement, access_type: null, is_two_fa_required: null, expiration_period: 3600000, is_certified_user_required: null, is_validated_profile_required: null, is_duc_required: false, is_irb_approval_required: null, are_other_attachments_required: null, is_idu_required: null, is_idu_public: true}
