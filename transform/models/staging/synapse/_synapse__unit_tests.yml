version: 2

unit_tests:
  - name: access_requirement_revisions_decode_historical_settings
    description: "Decodes historical metadata, eligibility, document, IDU, 2FA, and expiration settings; preserves false, zero, and negative values; and returns null for missing or unrecognized settings. Requirement type comes from concreteType when present and otherwise the XML root tag."
    model: stg_synapse__access_requirement_revision
    given:
      - input: source('rds', 'access_requirement_revision')
        format: sql
        rows: |
          select
              100 as owner_id,
              0 as number,
              10 as modified_by,
              1767225600000 as modified_on,
              to_binary('', 'HEX') as serialized_entity
          union all
          select
              100, 1, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 2, 10, 1767225600000,
              to_binary('1f8b0800000000000213b3c92f4ad72b4e4c4f4dcacccf4b2d29cf2fca2ed62b4a2dc8d7cbcd4f49cdd1f34dcc034aa6383a87382627a7161707a516966616a5e6a6e695d8d9e853a019003e77256e79000000', 'HEX')
          union all
          select
              100, 3, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 4, 10, 1767225600000,
              null::binary
          union all
          select
              100, 5, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 6, 10, 1767225600000,
              to_binary('', 'HEX')
          union all
          select
              100, 7, 10, 1767225600000,
              to_binary('', 'HEX')
    expect:
      rows:
        - {access_requirement_id: 100, access_requirement_version: 0, access_requirement_name: Requirement 100 revision 0, access_requirement_type: ACTAccessRequirement, access_requirement_access_type: DOWNLOAD, is_two_fa_required: false, expiration_period: 86400000, is_certified_user_required: false, is_validated_profile_required: false, is_duc_required: false, is_irb_approval_required: false, are_other_attachments_required: false, is_idu_required: false, is_idu_public: false}
