        - {access_requirement_id: 100, access_requirement_version: 3, access_requirement_name: Requirement 100 revision 3, access_requirement_type: ManagedACTAccessRequirement, access_requirement_access_type: DOWNLOAD, is_two_fa_required: null, expiration_period: null, is_certified_user_required: null, is_validated_profile_required: null, is_duc_required: null, is_irb_approval_required: null, are_other_attachments_required: null, is_idu_required: null, is_idu_public: null}
