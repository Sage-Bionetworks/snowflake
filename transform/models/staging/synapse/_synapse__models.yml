version: 2
models:
  - name: stg_synapse__access_approval
    description: "Staging model for access approval records. Tracks which users have been granted or revoked access to specific access requirements."
    constraints:
      - type: primary_key
        columns: [access_requirement_id, accessor_id, access_requirement_version, submitter_id]
    columns:
      - name: access_requirement_approval_id
        description: "Unique identifier for the access approval record"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: access_requirement_id
        description: "Which requirement this approval satisfies"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: access_requirement_version
        description: "Version number of the access requirement at the time of approval"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who created this access approval"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_on
        description: "UTC timestamp when the access approval was created"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: modified_by
        description: "Identifier of the user who last modified this access approval"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: modified_on
        description: "UTC timestamp when the access approval was last modified"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: submitter_id
        description: "User ID of the person who submitted the approval request"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: accessor_id
        description: "User ID of the person being granted access"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: expired_on
        description: "UTC timestamp when the approval expires. 0 means no expiration."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state
        description: "State of the access approval. Valid values are 'APPROVED' or 'REVOKED'."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null

  - name: stg_synapse__access_requirement
    description: >-
      The staging model for current access requirement data. One row represents an access
      requirement, identified by access_requirement_id. Access requirements define conditions for
      accessing restricted data or participating in activities, such as approval workflows or
      two-factor authentication. The model standardizes column names and types, converts the
      creation timestamp from epoch milliseconds, and maps recognized requirement classes to
      unqualified names.
    constraints:
      - type: primary_key
        columns: [access_requirement_id]
    columns:
      - name: access_requirement_id
        description: >-
          The unique identifier of the access requirement.
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: access_requirement_name
        description: >-
          The unique human-readable name of the current access requirement.
        data_type: VARCHAR
        constraints:
          - type: not_null
          - type: unique
      - name: access_requirement_type
        description: >-
          The unqualified class name identifying the current access requirement type. One of:
          LockAccessRequirement, ManagedACTAccessRequirement, ACTAccessRequirement,
          SelfSignAccessRequirement, TermsOfUseAccessRequirement, or
          PostMessageContentAccessRequirement. Unrecognized source class names become NULL.
        data_type: VARCHAR
      - name: created_by
        description: >-
          The unique identifier of the user who created the access requirement.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_on
        description: >-
          The UTC timestamp when the access requirement was created. Converted from Unix epoch
          milliseconds.
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: access_requirement_current_version
        description: >-
          The current revision number of the access requirement. Revision numbers begin at 0.
        data_type: NUMBER
      - name: is_two_fa_required
        description: >-
          If true, accessors must use two-factor authentication to satisfy the current access
          requirement.
        data_type: BOOLEAN
        constraints:
          - type: not_null
      - name: access_requirement_access_type
        description: >-
          The permission controlled by the current access requirement. DOWNLOAD controls downloading
          data; PARTICIPATE controls participation.
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: etag
        description: >-
          Entity tag for optimistic concurrency control (36-character UUID)
        data_type: VARCHAR(36)
        constraints:
          - type: not_null

  - name: stg_synapse__access_requirement_project
    description: "Staging model for junction table linking access requirements to projects."
    constraints:
      - type: primary_key
        columns: [access_requirement_id, project_id]
    columns:
      - name: access_requirement_id
        description: "The access requirement identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: access_requirement_project
        description: "The identifier of the project entity which this access requirement associates with."
        data_type: NUMBER
        constraints:
          - type: not_null

  - name: stg_synapse__access_requirement_revision
    description: >-
      The staging model for historical access requirement revision data. One row represents a
      revision, identified by access_requirement_id and access_requirement_version. The model
      renames identifiers, converts the revision timestamp from epoch milliseconds, and extracts
      properties from gzip-compressed XML. Missing or unrecognized Boolean and numeric properties
      become NULL; historical settings are not filled from the current requirement.
    constraints:
      - type: primary_key
        columns: [access_requirement_id, access_requirement_version]
    columns:
      - name: access_requirement_id
        description: >-
          The unique identifier of the access requirement.
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: access_requirement_version
        description: >-
          The revision number of the access requirement. Revision numbers begin at 0.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: modified_by
        description: >-
          The unique identifier of the user who created this access requirement revision.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: modified_on
        description: >-
          The UTC timestamp when this access requirement revision was created.
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: description
        description: >-
          The descriptive text recorded for the access requirement at this revision. NULL when
          absent from the revision.
        data_type: VARCHAR
      - name: etag
        description: >-
          The entity tag recorded for this access requirement revision. This is the historical tag
          from the revision payload, rather than the current base requirement tag. NULL when absent
          from the revision.
        data_type: VARCHAR
      - name: url
        description: >-
          The URL recorded for the access requirement at this revision, for example a link to an
          external participation requirement. NULL when absent from the revision.
        data_type: VARCHAR
      - name: terms_of_use
        description: >-
          The terms of use text recorded for the access requirement at this revision. NULL when
          absent from the revision.
        data_type: VARCHAR
      - name: duc_template_file_handle_id
        description: >-
          The unique identifier of the file handle containing the Data Use Certificate template for
          this revision. NULL when absent or not numeric.
        data_type: NUMBER
      - name: e_duc_template_id
        description: >-
          The identifier of the electronic Data Use Certificate template for this revision.
          Identifiers may be UUIDs. NULL when absent from the revision.
        data_type: VARCHAR
      - name: jira_key
        description: >-
          The Jira issue key recorded for this access requirement revision. NULL when absent from
          the revision.
        data_type: VARCHAR
      - name: act_contact_info
        description: >-
          The Access and Compliance Team contact information recorded for this access requirement
          revision. NULL when absent from the revision.
        data_type: VARCHAR
      - name: open_jira_issue
        description: >-
          If true, this revision requests opening a Jira issue. NULL when absent or not recognized
          as a Boolean; values are not inferred from the current requirement.
        data_type: BOOLEAN
      - name: subjects_defined_by_annotations
        description: >-
          If true, this revision defines its subjects through annotations. NULL when absent or not
          recognized as a Boolean; values are not inferred from the current requirement.
        data_type: BOOLEAN
      - name: form_template_id
        description: >-
          The identifier of the form template referenced by this revision's formTemplateRef. NULL
          when absent or not numeric.
        data_type: NUMBER
      - name: form_template_version
        description: >-
          The version of the form template referenced by this revision's formTemplateRef. NULL when
          absent or not numeric.
        data_type: NUMBER
      - name: subject_ids
        description: >-
          The subjects governed by this access requirement revision, represented as an ordered array
          of objects with string id and type fields. NULL when subjectIds is absent; an empty array
          when explicitly empty. Non-object entries are omitted, and absent id or type fields are
          omitted from individual objects.
        data_type: ARRAY
      - name: is_two_fa_required
        description: >-
          If true, accessors must use two-factor authentication to satisfy this access requirement
          revision. NULL when absent or not recognized as a Boolean; values are not inferred from
          the current requirement.
        data_type: BOOLEAN
      - name: access_requirement_name
        description: >-
          The human-readable name of the access requirement at this revision. NULL when the revision
          has no name or an empty name.
        data_type: VARCHAR
      - name: access_requirement_type
        description: >-
          The unqualified class name identifying the access requirement type at this revision, such
          as ManagedACTAccessRequirement. Extracted from concreteType, falling back to the XML root
          tag; NULL when neither is available.
        data_type: VARCHAR
      - name: access_requirement_access_type
        description: >-
          The permission controlled by the access requirement at this revision, such as DOWNLOAD or
          PARTICIPATE. NULL when absent from the revision.
        data_type: VARCHAR
      - name: is_certified_user_required
        description: >-
          If true, accessors must be Synapse Certified Users to satisfy this revision. NULL when
          absent or not recognized as a Boolean; values are not inferred from the current
          requirement.
        data_type: BOOLEAN
      - name: is_validated_profile_required
        description: >-
          If true, accessors must have validated Synapse profiles to satisfy this revision. NULL
          when absent or not recognized as a Boolean; values are not inferred from the current
          requirement.
        data_type: BOOLEAN
      - name: is_duc_required
        description: >-
          If true, this revision requires a signed Data Use Certificate. NULL when absent or not
          recognized as a Boolean; values are not inferred from the current requirement.
        data_type: BOOLEAN
      - name: is_irb_approval_required
        description: >-
          If true, this revision requires an Institutional Review Board approval document. NULL when
          absent or not recognized as a Boolean; values are not inferred from the current
          requirement.
        data_type: BOOLEAN
      - name: are_other_attachments_required
        description: >-
          If true, this revision requires attachments in addition to Data Use Certificate and
          Institutional Review Board documents. NULL when absent or not recognized as a Boolean;
          values are not inferred from the current requirement.
        data_type: BOOLEAN
      - name: is_idu_required
        description: >-
          If true, this revision requires an Intended Data Use statement. NULL when absent or not
          recognized as a Boolean; values are not inferred from the current requirement.
        data_type: BOOLEAN
      - name: is_idu_public
        description: >-
          If true, this revision makes submitted Intended Data Use statements public. NULL when
          absent or not recognized as a Boolean; values are not inferred from the current
          requirement.
        data_type: BOOLEAN
      - name: expiration_period
        description: >-
          The validity period of approved access under this revision, in milliseconds. Zero means no
          expiration. NULL when absent or not numeric. Negative values are retained here but do not
          produce an expiration timestamp downstream.
        data_type: NUMBER

  - name: stg_synapse__acl
    description: "Staging model for ACLs. Defines who can access an entity and with what permissions."
    constraints:
      - type: primary_key
        columns: [object_id, object_type]
    columns:
      - name: acl_id
        description: "Unique identifier for the ACL (Access Control List)"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: object_id
        description: "ID of the entity or object that this ACL grants access to"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: object_type
        description: "Type of entity or object that owns this ACL"
        data_type: VARCHAR
      - name: created_on
        description: "UTC Timestamp when the ACL was created"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null

  - name: stg_synapse__acl_resource_access
    description: "Staging model defining which user groups have access to resources controlled by ACLs."
    constraints:
      - type: primary_key
        columns: [acl_resource_access_id]
    columns:
      - name: acl_resource_access_id
        description: "Unique identifier for this ACL resource access"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: acl_id
        description: "The ACL identifier. Not to be confused with the entity or object upon which this ACL grants access to."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__acl')
            to_columns: [acl_id]
            warn_unenforced: false
      - name: principal_id
        description: "The user or team being granted access"
        data_type: NUMBER
        constraints:
          - type: not_null

  - name: stg_synapse__acl_resource_access_type
    description: "Staging model defining the specific permission types granted for each resource access record."
    constraints:
      - type: primary_key
        columns: [acl_resource_access_id, access_type]
    columns:
      - name: acl_resource_access_id
        description: "The ACL resource access identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__acl_resource_access')
            to_columns: [acl_resource_access_id]
            warn_unenforced: false
      - name: access_type
        description: "The permission type (e.g., 'READ', 'UPDATE', 'DELETE', 'CHANGE_PERMISSIONS', 'DOWNLOAD', 'CREATE', ...)."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: acl_id
        description: "The ACL identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__acl')
            to_columns: [acl_id]
            warn_unenforced: false

  - name: stg_synapse__data_access_request
    description: "Staging model for formal requests for access to controlled data. Links users, access requirements, and research projects."
    constraints:
      - type: primary_key
        columns: [data_access_request_id]
    columns:
      - name: data_access_request_id
        description: "Unique identifier for the data access request"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: access_requirement_id
        description: "Which access requirement this request is for"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: created_by
        description: "Identifier of the user who created this request"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: research_project_id
        description: "The identifier of the research project which this data access request associates with"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_on
        description: "UTC timestamp when the request was created"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: modified_by
        description: "Identifier of the user who last modified this request"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: modified_on
        description: "UTC timestamp when the request was last modified"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null
      - name: data_access_request_raw
        description: "Serialized representation of the complete request object"
        data_type: BINARY
        constraints:
          - type: not_null

  - name: stg_synapse__data_access_notification
    description: "Staging model tracking notifications sent to users about their data access status, including renewal reminders and revocation notices."
    constraints:
      - type: primary_key
        columns: [data_access_notification_id]
    columns:
      - name: data_access_notification_id
        description: "Unique identifier for the notification record"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: data_access_notification_type
        description: "Type of notification sent to the user (one of 'FIRST_RENEWAL_REMINDER', 'SECOND_RENEWAL_REMINDER', 'REVOCATION')"
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The access requirement identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: principal_id
        description: "User ID of the notification recipient"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_approval_id
        description: "The identifier of the associated access approval"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_approval')
            to_columns: [access_requirement_approval_id]
            warn_unenforced: false
      - name: sent_on
        description: "UTC Timestamp when the notification was sent"
        data_type: TIMESTAMP_NTZ(3)
        constraints:
          - type: not_null
      - name: message_id
        description: "Unique identifier of the message"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null

  - name: stg_synapse__data_access_submission
    description: "Staging model for formal submissions for data access approval. Created when users submit their data access requests for review."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: access_requirement_id
        description: "The access requirement identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: data_access_request_id
        description: "The data access request identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__data_access_request')
            to_columns: [data_access_request_id]
            warn_unenforced: false
      - name: research_project_id
        description: "The research project associated with this submission"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who made this submission"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_on
        description: "UTC timestamp when the submission was created"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object"
        data_type: BINARY
        constraints:
          - type: not_null

  - name: stg_synapse__data_access_submission_accessor_changes
    description: >-
      The staging model for requested accessor change data. One row represents a user listed in a
      data access submission, identified by data_access_submission_id and principal_id. The model
      standardizes submission and user identifiers and names the requested change
      accessor_change_type. Rows describe requested gains, renewals, or revocations; approval must
      be determined from the submission status.
    constraints:
      - type: primary_key
        columns: [data_access_submission_id, principal_id]
    columns:
      - name: data_access_submission_id
        description: >-
          The unique identifier of the data access submission requesting this change. Join to
          stg_synapse__data_access_submission on data_access_submission_id for submission details.
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__data_access_submission')
            to_columns: [data_access_submission_id]
            warn_unenforced: false
      - name: principal_id
        description: >-
          The unique identifier of the Synapse user whose access is requested to change. The
          accessor need not be the user who submitted the request.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: accessor_change_type
        description: >-
          The requested change to the user's access. GAIN_ACCESS requests new access; RENEW_ACCESS
          requests renewal of existing access; REVOKE_ACCESS requests removal of access. Only an
          Approved submission confirms the requested change.
        data_type: VARCHAR
        constraints:
          - type: not_null

  - name: stg_synapse__data_access_submission_status
    description: "Staging model for current status of data access submissions. Tracks the approval workflow state and reasons for decisions."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "The data access submission identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
          - type: foreign_key
            to: ref('stg_synapse__data_access_submission')
            to_columns: [data_access_submission_id]
            warn_unenforced: false
      - name: created_by
        description: "Identifier of the user who created this status record"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_on
        description: "UTC timestamp when the status was created"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state_modified_by
        description: "User ID of the person who last modified this status"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: state_modified_on
        description: "UTC timestamp when the submission status was last modified"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: state_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations. Null for records before 2019 due to invalid utf-8 characters."
        data_type: VARCHAR

  - name: stg_synapse__data_access_submission_submitter
    description: "Staging model tracking the current active submission for each submitter per access requirement."
    constraints:
      - type: primary_key
        columns: [access_requirement_id, principal_id]
    columns:
      - name: data_access_submission_submitter_id
        description: "Unique identifier for this submitter record"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: access_requirement_id
        description: "The access requirement identifier"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: principal_id
        description: "User ID of the submitter"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: data_access_submission_id
        description: "The current active data access submission"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__data_access_submission')
            to_columns: [data_access_submission_id]
            warn_unenforced: false
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null

  - name: stg_synapse__principal_alias
    description: "Staging model for principal aliases. Stores usernames, team names, email addresses, ORCID IDs, and OpenIDs for user and team principals."
    constraints:
      - type: primary_key
        columns: [principal_alias_id]
    columns:
      - name: principal_alias_id
        description: "Unique identifier for the principal alias record"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: principal_id
        description: "The globally unique identifier of the principal associated with this alias. For a Synapse user, this is the user ID. For a Synapse team, this is the team ID."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: alias_unique
        description: "Unique normalized alias value used for lookups and validation. Guaranteed to be globally unique across all principals."
        data_type: VARCHAR
        constraints:
          - type: not_null
          - type: unique
      - name: alias_display
        description: "Display version of the alias, preserving original character casing and formatting"
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: alias_type
        description: "Type of alias. Valid values are 'USER_NAME', 'TEAM_NAME', 'USER_EMAIL', 'USER_OPEN_ID' (OpenID identifier), or 'USER_ORCID' (ORCID identifier)."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null
