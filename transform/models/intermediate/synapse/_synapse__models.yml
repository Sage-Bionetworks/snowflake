version: 2
models:
  - name: int_synapse_accessor_changes
    description: "Requested accessor changes from data access submissions, with one row per submission and principal."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id, principal_id]
      - type: foreign_key
        columns: [data_access_submission_id, principal_id]
        to: ref('stg_synapse__data_access_submission_accessor_changes')
        to_columns: [data_access_submission_id, principal_id]
        warn_unenforced: false
      - type: foreign_key
        columns: [access_requirement_id, access_requirement_version_reviewed_against]
        to: ref('int_synapse_access_requirement')
        to_columns: [access_requirement_id, access_requirement_version]
        warn_unenforced: false
    columns:
      - name: data_access_submission_id
        description: "Identifier of the submission requesting this access change."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('stg_synapse__data_access_submission')
            to_columns: [data_access_submission_id]
            warn_unenforced: false
        data_tests:
          - not_null
      - name: principal_id
        description: "Identifier of the accessor whose access is requested to change."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: access_type
        description: "Requested access change: GAIN_ACCESS, RENEW_ACCESS, or REVOKE_ACCESS. The change is confirmed only when the submission is Approved."
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS']
      - name: access_requirement_id
        description: "Identifier of the access requirement affected by the submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version_submitted_against
        description: "Access requirement revision recorded at submission time. We retain this for additional context; it's not used to derive effective terms, which are contingent on the current access requirement version at time of review."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version_reviewed_against
        description: "Current access requirement revision when the submission was approved or rejected. Null for Submitted or Cancelled submissions, or when no eligible access requirement revision is available."
        data_type: NUMBER
      - name: state
        description: "Current submission review state: Submitted, Approved, Rejected, or Cancelled. Only Approved confirms the requested accessor change."
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Submitted', 'Approved', 'Rejected', 'Cancelled']
      - name: state_modified_on
        description: "UTC timestamp when the current submission state was set. For Submitted submissions, this equals the submission's creation time. For Approved, Rejected, or Cancelled submissions, this records the terminal state transition. Only Approved confirms the requested accessor changes; a populated timestamp alone does not indicate review or approval."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: derived_expired_on
        description: "Derived UTC expiration of gained or renewed access: approval timestamp plus the active access requirement revision's expiration period. Null for non-approved submissions, revocations, unlimited duration (zero), unavailable periods, or invalid nonpositive periods. Later requirement revisions do not recalculate this event's expiration."
        data_type: TIMESTAMP_NTZ

  - name: int_synapse_access_requirement
    description: "Access requirement data with one row per access requirement and access requirement version, including decoded revision properties and complete parsed XML. Creation metadata comes from the base requirement; serialized audit metadata is exposed separately."
    constraints:
      - type: primary_key
        columns: [access_requirement_id, access_requirement_version]
    columns:
      - name: access_requirement_id
        description: "Unique identifier for the access requirement"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Revision number of this access requirement. Revision numbers begin from 0."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_name
        description: "Human-readable requirement name for this revision. Null when absent or empty."
        data_type: VARCHAR
      - name: access_requirement_type
        description: "The type of access requirement"
        data_type: VARCHAR
      - name: created_by
        description: "Identifier of the user who created this access requirement revision."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_on
        description: "UTC timestamp when this access requirement was initially created, from the base requirement."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: modified_by
        description: "Identifier of the user who created this revision"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: modified_on
        description: "UTC timestamp when this revision was created"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: is_two_fa_required
        description: "Whether 2FA was required at this revision. If 2FA is unset for this revision, we match the 2FA setting of the current revision."
        data_type: BOOLEAN
      - name: access_type
        description: "Permission controlled by this requirement at this revision."
        data_type: VARCHAR
      - name: is_certified_user_required
        description: "Whether this revision requires accessors to be Synapse Certified Users. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: is_validated_profile_required
        description: "Whether this revision requires accessors to have validated Synapse profiles. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: is_duc_required
        description: "Whether this revision requires a signed Data Use Certificate. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: is_irb_approval_required
        description: "Whether this revision requires an Institutional Review Board approval document. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: are_other_attachments_required
        description: "Whether this revision requires attachments in addition to DUC and IRB documents. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: is_idu_required
        description: "Whether this revision requires an Intended Data Use statement. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: is_idu_public
        description: "Whether this revision makes submitted Intended Data Use statements public. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: description
        description: "Description recorded in this access requirement revision."
        data_type: VARCHAR
      - name: etag
        description: "Entity tag recorded in this serialized access requirement revision; not the current base requirement etag."
        data_type: VARCHAR
      - name: url
        description: "URL recorded in this revision, including external participation requirements."
        data_type: VARCHAR
      - name: terms_of_use
        description: "Terms of use text recorded in this revision."
        data_type: VARCHAR
      - name: duc_template_file_handle_id
        description: "File handle identifier of the Data Use Certificate template for this revision."
        data_type: NUMBER
      - name: e_duc_template_id
        description: "Electronic Data Use Certificate template identifier. May be a UUID."
        data_type: VARCHAR
      - name: jira_key
        description: "Jira issue key recorded in this revision."
        data_type: VARCHAR
      - name: act_contact_info
        description: "Access and Compliance Team contact information recorded in this revision."
        data_type: VARCHAR
      - name: open_jira_issue
        description: "Whether this revision requests opening a Jira issue. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: subjects_defined_by_annotations
        description: "Whether this revision defines its subjects through annotations. Null when absent or unrecognized."
        data_type: BOOLEAN
      - name: form_template_id
        description: "Form template identifier from this revision's formTemplateRef."
        data_type: NUMBER
      - name: form_template_version
        description: "Form template version from this revision's formTemplateRef."
        data_type: NUMBER
      - name: subject_ids
        description: "Subjects recorded in this revision as an ordered array of objects with string id and type. Null when absent; an empty array when explicitly empty."
        data_type: ARRAY
      - name: serialized_created_by
        description: "Creator identifier embedded in this serialized revision, separate from source metadata."
        data_type: NUMBER
      - name: serialized_created_on
        description: "UTC creation timestamp embedded in this serialized revision; may differ from source metadata."
        data_type: TIMESTAMP_NTZ
      - name: serialized_modified_by
        description: "Modifier identifier embedded in this serialized revision, separate from source metadata."
        data_type: NUMBER
      - name: serialized_modified_on
        description: "UTC modification timestamp embedded in this serialized revision; may differ from source metadata."
        data_type: TIMESTAMP_NTZ
      - name: access_requirement_xml
        description: "Complete parsed revision XML with automatic scalar conversion disabled, retaining embedded metadata and properties not extracted into typed columns. Original compressed bytes remain in the raw source."
        data_type: VARIANT
      - name: expiration_period
        description: "Approval validity period in milliseconds for this revision. Zero means no expiration. Null when absent or malformed."
        data_type: NUMBER

  - name: int_synapse_acl
    description: "Intermediate model flattening ACL data to show which principals have which access types for each resource."
    constraints:
      - type: primary_key
        columns: [acl_id, principal_id]
    columns:
      - name: acl_id
        description: "Unique identifier for the ACL (Access Control List). Not to be confused with the entity or object upon which this ACL grants access to."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: object_id
        description: "ID of the entity or object that this ACL grants access to"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: object_type
        description: "Type of entity or object that owns this ACL"
        data_type: VARCHAR
      - name: created_on
        description: "UTC Timestamp when the ACL was created"
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR(36)
        constraints:
          - type: not_null
      - name: principal_id
        description: "The user or team being granted access"
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_type
        description: "All permission types granted to this principal (e.g., 'READ', 'UPDATE', 'DELETE', 'CHANGE_PERMISSIONS', 'DOWNLOAD', 'CREATE', etc.)."
        data_type: VARIANT
        constraints:
          - type: not_null

  - name: int_synapse_data_access_submission
    description: "Intermediate model combining data access submissions with their current status and aggregated accessor changes. A data access submission is a snapshot of an access request at submission time. When users modify rejected requests, new submissions are created, forming a revision history."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: data_access_request_id
        description: "The identifier of the access request that this submission was created from."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The identifier of the access requirement that the access request associates with."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: research_project_id
        description: "The research project associated with this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who made this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_on
        description: "UTC timestamp when the submission was created."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state_modified_by
        description: "Identifier of the user who last modified the submission status."
        data_type: NUMBER
      - name: state_modified_on
        description: "UTC timestamp when the submission status was last modified."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: state_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations. Null for records before 2019 due to invalid utf-8 characters."
        data_type: VARCHAR
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)."
        data_type: VARCHAR(36)
        constraints:
          - type: not_null
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object."
        data_type: BINARY
        constraints:
          - type: not_null
      - name: accessor_changes
        description: "A mapping of principal IDs (as strings) to their access type changes (e.g., {'123': 'GAIN_ACCESS', '456': 'RENEW_ACCESS'}). Access types include: 'GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS'"
        data_type: VARIANT

  - name: int_synapse_data_access_submission_enriched
    description: "Intermediate model enriching data access submissions with data types associated with submission data, such as user profile information."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: data_access_request_id
        description: "The identifier of the access request that this submission was created from."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The identifier of the access requirement that the access request associates with."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: research_project_id
        description: "The research project associated with this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who made this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by_user_name
        description: "Username of the user who made this submission."
        data_type: VARCHAR
      - name: created_on
        description: "UTC timestamp when the submission was created."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state_modified_by
        description: "Identifier of the user who last modified the submission status."
        data_type: NUMBER
      - name: state_modified_by_user_name
        description: "Username of the user who last modified the submission status."
        data_type: VARCHAR
      - name: state_modified_on
        description: "UTC timestamp when the submission status was last modified."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: submission_type
        description: "Submission classification. One of: 'New', 'Update', or 'Annual Renewal'. A submission is 'New' when it is the first submission for the data access request or when no previously approved submission exists for that request. A submission is 'Update' when the most recently approved submission associated with the data access request was approved less than 10 months before the current submission was created. A submission is 'Annual Renewal' when the most recently approved submission associated with the data access request was approved more than 10 months before this submission was created."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: attempt
        description: "The submission attempt number within the current approval cycle for this data access request. Cancelled submissions do not count toward this sequence and are shown as NULL."
        data_type: NUMBER
      - name: state_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations. Null for records before 2019 due to invalid utf-8 characters."
        data_type: VARCHAR
      - name: accessor_changes
        description: "A mapping of principal IDs (as strings) to their access type changes (e.g., {'123': 'GAIN_ACCESS', '456': 'RENEW_ACCESS'}). Access types include: 'GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS'"
        data_type: VARIANT
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object."
        data_type: BINARY
        constraints:
          - type: not_null
