        - team_id: 1
          user_id: 30
          approximate_event_timestamp: '2022-01-05 00:00:00.000'
          event_type: join
          is_admin: false
        - team_id: 1
          user_id: 40
          approximate_event_timestamp: '2022-01-05 00:00:00.000'
