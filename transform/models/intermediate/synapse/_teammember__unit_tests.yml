          - team_id: 1
            user_id: 10
            snapshot_timestamp: '2022-01-05 23:59:59.999'
            snapshot_date: '2022-01-05'
            is_admin: false
          - team_id: 1
            user_id: 20
            snapshot_timestamp: '2022-01-06 00:00:00.001'
            snapshot_date: '2022-01-06'
            is_admin: false
          - team_id: 1
            user_id: 10
            snapshot_timestamp: '2022-01-06 09:00:00.000'
            snapshot_date: '2022-01-06'
            is_admin: true
          - team_id: 1
            user_id: 20
            snapshot_timestamp: '2022-01-06 09:00:00.001'
            snapshot_date: '2022-01-06'
            is_admin: false
          - team_id: 1
            user_id: 30
            snapshot_timestamp: '2022-01-06 09:00:00.002'
            snapshot_date: '2022-01-06'
            is_admin: false
          - team_id: 1
            user_id: 20
            snapshot_timestamp: '2022-01-06 15:00:00.000'
            snapshot_date: '2022-01-06'
            is_admin: false
          - team_id: 1
            user_id: 30
            snapshot_timestamp: '2022-01-06 15:00:00.001'
            snapshot_date: '2022-01-06'
            is_admin: false
    expect:
      rows:
        - team_id: 1
          user_id: 10
          approximate_event_timestamp: '2022-01-05 23:59:59.999'
          event_type: join
          is_admin: false
        - team_id: 1
          user_id: 20
          approximate_event_timestamp: '2022-01-05 23:59:59.999'
          event_type: join
          is_admin: false
        - team_id: 1
          user_id: 10
          approximate_event_timestamp: '2022-01-06 09:00:00.000'
          event_type: update
          is_admin: true
        - team_id: 1
          user_id: 30
          approximate_event_timestamp: '2022-01-06 09:00:00.000'
          event_type: join
          is_admin: false
        - team_id: 1
          user_id: 10
          approximate_event_timestamp: '2022-01-06 15:00:00.000'
          event_type: depart
          is_admin: null
