version: 2
models:
  - name: data_access_submission_dashboard
    config:
      schema: governance
    description: "Dashboard view of data access submissions with governance enrichment, including the requirement name from the exact submitted revision."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: data_access_request_id
        description: "The identifier of the access request that this submission was created from."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The identifier of the access requirement that the access request associates with."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_name
        description: "Requirement name recorded in the exact revision associated with this submission. Null when historical metadata is unavailable."
        data_type: VARCHAR
      - name: access_requirement_name_most_recent
        description: "Requirement name from the largest available access requirement version for this requirement, regardless of the submitted revision. Null when that revision has no name or requirement metadata is unavailable."
        data_type: VARCHAR
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_type
        description: "The type of access requirement. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: VARCHAR
      - name: access_type
        description: "Permission controlled by this requirement at this revision. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: VARCHAR
      - name: is_two_fa_required
        description: "Whether 2FA was required at the submitted revision. Inherits the intermediate model fallback to the base 2FA setting only when the submitted revision is the current revision. Null when unavailable."
        data_type: BOOLEAN
      - name: is_certified_user_required
        description: "Whether this revision requires accessors to be Synapse Certified Users. Null when absent or unrecognized. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: BOOLEAN
      - name: is_validated_profile_required
        description: "Whether this revision requires accessors to have validated Synapse profiles. Null when absent or unrecognized. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: BOOLEAN
      - name: is_duc_required
        description: "Whether this revision requires a signed Data Use Certificate. Null when absent or unrecognized. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: BOOLEAN
      - name: is_irb_approval_required
        description: "Whether this revision requires an Institutional Review Board approval document. Null when absent or unrecognized. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: BOOLEAN
      - name: are_other_attachments_required
        description: "Whether this revision requires attachments in addition to DUC and IRB documents. Null when absent or unrecognized. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: BOOLEAN
      - name: is_idu_required
        description: "Whether this revision requires an Intended Data Use statement. Null when absent or unrecognized. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: BOOLEAN
      - name: is_idu_public
        description: "Whether this revision makes submitted Intended Data Use statements public. Null when absent or unrecognized. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: BOOLEAN
      - name: expiration_period
        description: "Approval validity period in milliseconds for this revision. Zero means no expiration. Null when absent or malformed. Uses the exact requirement version associated with the submission; null when that revision is unavailable."
        data_type: NUMBER
      - name: research_project_id
        description: "The research project associated with this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: submitted_by
        description: "Identifier of the user who made this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: submitted_by_user_name
        description: "Username of the user who made this submission."
        data_type: VARCHAR
      - name: submitted_on
        description: "UTC timestamp when the submission was created."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: attempt
        description: "The submission attempt number within the current approval cycle for this data access request. Cancelled submissions do not count toward this sequence and are shown as NULL."
        data_type: NUMBER
      - name: submission_status
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
      - name: submission_type
        description: "Submission classification. One of: 'New', 'Update', or 'Annual Renewal'. A submission is 'New' when it is the first submission for the data access request or when no previously approved submission exists for that request. A submission is 'Update' when the most recently approved submission associated with the data access request was approved less than 10 months before the current submission was created. A submission is 'Annual Renewal' when the most recently approved submission associated with the data access request was approved more than 10 months before this submission was created."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: reviewed_by
        description: "Identifier of the user who last modified the submission status. Null if `submission_status` is 'Submitted' or 'Cancelled', since those states have no reviewer."
        data_type: NUMBER
      - name: reviewed_by_user_name
        description: "Username of the user who last modified the submission status. Null if `submission_status` is 'Submitted' or 'Cancelled', since those states have no reviewer."
        data_type: VARCHAR
      - name: reviewed_on
        description: "UTC timestamp when the submission status was last modified. Null if `submission_status` is 'Submitted' or 'Cancelled', since those states have no reviewer."
        data_type: TIMESTAMP_NTZ
      - name: submission_status_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations."
        data_type: VARCHAR
      - name: accessor_changes
        description: "A mapping of principal IDs (as strings) to their access type changes (e.g., {'123': 'GAIN_ACCESS', '456': 'RENEW_ACCESS'}). Access types include: 'GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS'"
        data_type: VARIANT
      - name: accessor_count
        description: "The number of accessors (principals) affected by this submission."
        data_type: NUMBER
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object."
        data_type: BINARY
        constraints:
          - type: not_null
