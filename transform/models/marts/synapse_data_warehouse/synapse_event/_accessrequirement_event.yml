version: 2
models:
  - name: accessrequirement_event
    description: |-
      Historical revisions of Synapse access requirements. One row represents a revision,
      uniquely identified by `access_requirement_id` and `access_requirement_version`.
      The history includes available revisions of requirements still present in Synapse.
      `modified_on` records when the revision was created. Deletion events are unavailable.
      For Boolean settings, NULL means the setting is unavailable. Join to
      `accessor_change_event` on both key columns to see the requirement terms used for an
      approved access change.

      *This text was generated in whole or part by AI and has been reviewed for correctness by myself.*
    constraints:
      - type: primary_key
        columns: [access_requirement_id, access_requirement_version]
    columns:
      - name: access_requirement_id
        description: >-
          PRIMARY KEY (Composite). The unique identifier of the access requirement.
        data_type: NUMBER
        data_tests:
          - not_null
      - name: access_requirement_version
        description: >-
          PRIMARY KEY (Composite). The revision number of the access requirement. Revision numbers
          begin at 0.
        data_type: NUMBER
        data_tests:
          - not_null
      - name: access_requirement_name
        description: >-
          The human-readable name of the access requirement at this revision. Uses the name recorded
          in the revision. at the current revision, falls back to the requirement's name when the
          revision records none. NULL for earlier revisions without a recorded name and for
          requirements that were never named (Synapse stores an empty string or the requirement ID
          as a placeholder).
        data_type: VARCHAR
      - name: access_requirement_type
        description: >-
          The unqualified class name identifying the access requirement type at this revision, such
          as ManagedACTAccessRequirement.
        data_type: VARCHAR
      - name: created_by
        description: >-
          The unique identifier of the user who initially created the access requirement.
        data_type: NUMBER
      - name: created_on
        description: >-
          The UTC timestamp when the access requirement was initially created.
        data_type: TIMESTAMP_NTZ
      - name: modified_by
        description: >-
          The unique identifier of the user who created this access requirement revision.
        data_type: NUMBER
      - name: modified_on
        description: >-
          The UTC timestamp when this access requirement revision was created.
        data_type: TIMESTAMP_NTZ
      - name: is_two_fa_required
        description: >-
          If true, accessors must use two-factor authentication to satisfy this access requirement
          revision.
        data_type: BOOLEAN
      - name: is_certified_user_required
        description: >-
          If true, accessors must be Synapse Certified Users to satisfy this revision.
        data_type: BOOLEAN
      - name: is_validated_profile_required
        description: >-
          If true, accessors must have validated Synapse profiles to satisfy this revision.
        data_type: BOOLEAN
      - name: is_duc_required
        description: >-
          If true, this revision requires a signed Data Use Certificate.
        data_type: BOOLEAN
      - name: is_irb_approval_required
        description: >-
          If true, this revision requires an Institutional Review Board approval document.
        data_type: BOOLEAN
      - name: are_other_attachments_required
        description: >-
          If true, this revision requires attachments in addition to Data Use Certificate and
          Institutional Review Board documents.
        data_type: BOOLEAN
      - name: is_idu_required
        description: >-
          If true, this revision requires an Intended Data Use statement.
        data_type: BOOLEAN
      - name: is_idu_public
        description: >-
          If true, this revision makes submitted Intended Data Use statements public.
        data_type: BOOLEAN
      - name: access_requirement_access_type
        description: >-
          The permission controlled by the access requirement at this revision, such as DOWNLOAD or
          PARTICIPATE. NULL when the revision records no value.
        data_type: VARCHAR
      - name: expiration_period
        description: >-
          The validity period of approved access under this revision, in milliseconds. Zero means no
          expiration. NULL when the value is unavailable. Negative values are retained here but do
          not produce an expiration timestamp downstream.
        data_type: NUMBER
      - name: description
        description: >-
          The descriptive text recorded for the access requirement at this revision. NULL when the
          revision records no value.
        data_type: VARCHAR
      - name: etag
        description: >-
          The entity tag recorded for this access requirement revision. NULL when the revision
          records no value.
        data_type: VARCHAR
      - name: url
        description: >-
          The URL recorded for the access requirement at this revision, for example a link to an
          external participation requirement. NULL when the revision records no value.
        data_type: VARCHAR
      - name: terms_of_use
        description: >-
          The terms of use text recorded for the access requirement at this revision. NULL when the
          revision records no value.
        data_type: VARCHAR
      - name: duc_template_file_handle_id
        description: >-
          The unique identifier of the file handle containing the Data Use Certificate template for
          this revision. NULL when the value is unavailable.
        data_type: NUMBER
      - name: e_duc_template_id
        description: >-
          The identifier of the electronic Data Use Certificate template for this revision.
          Identifiers may be UUIDs. NULL when the revision records no value.
        data_type: VARCHAR
      - name: jira_key
        description: >-
          The Jira issue key recorded for this access requirement revision. NULL when the revision
          records no value.
        data_type: VARCHAR
      - name: act_contact_info
        description: >-
          The Access and Compliance Team contact information recorded for this access requirement
          revision. NULL when the revision records no value.
        data_type: VARCHAR
      - name: open_jira_issue
        description: >-
          If true, this revision requests opening a Jira issue.
        data_type: BOOLEAN
      - name: subjects_defined_by_annotations
        description: >-
          If true, this revision defines its subjects through annotations.
        data_type: BOOLEAN
      - name: form_template_id
        description: >-
          The identifier of the form template referenced by this revision's formTemplateRef. NULL
          when the value is unavailable.
        data_type: NUMBER
      - name: form_template_version
        description: >-
          The version of the form template referenced by this revision's formTemplateRef. NULL when
          the value is unavailable.
        data_type: NUMBER
      - name: subject_ids
        description: >-
          The subjects governed by this access requirement revision, represented as an ordered array
          of objects with string id and type fields. An empty array when subjectIds is absent or
          explicitly empty. Non-object entries are omitted, and absent id or type fields are omitted
          from individual objects.
        data_type: ARRAY
