version: 2
models:
  - name: data_access_submission_event
    description: "This event table contains all data access submissions and their associated state. A data access submission is created each time a user makes a revision of their data access request."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: data_access_request_id
        description: "The identifier of the access request that this submission was created from."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The identifier of the access requirement that the access request associates with."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: research_project_id
        description: "The research project associated with this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who made this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by_user_name
        description: "Username of the user who made this submission."
        data_type: VARCHAR
      - name: created_on
        description: "UTC timestamp when the submission was created."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state_modified_by
        description: "Identifier of the user who last modified the submission status."
        data_type: NUMBER
      - name: state_modified_by_user_name
        description: "Username of the user who last modified the submission status."
        data_type: VARCHAR
      - name: state_modified_on
        description: "UTC timestamp when the submission status was last modified."
        data_type: TIMESTAMP_NTZ
      - name: state
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
      - name: submission_type
        description: "Submission classification. One of: 'New', 'Update', or 'Annual Renewal'. A submission is 'New' when it is the first submission for the data access request or when no previously approved submission exists for that request. A submission is 'Update' when the most recently approved submission associated with the data access request was approved less than 10 months before the current submission was created. A submission is 'Annual Renewal' when the most recently approved submission associated with the data access request was approved more than 10 months before this submission was created."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: state_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations. Null for records before 2019 due to invalid utf-8 characters."
        data_type: VARCHAR
      - name: accessor_changes
        description: "A mapping of principal IDs (as strings) to their access type changes (e.g., {'123': 'GAIN_ACCESS', '456': 'RENEW_ACCESS'}). Access types include: 'GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS'"
        data_type: VARIANT
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object."
        data_type: BINARY
        constraints:
          - type: not_null

  - name: teammember_event
    description: |
      Membership history for every Synapse team.
      Each row represents a join, team manager promotion or demotion, or departure event.
      The key is (team_id, user_id, approximate_event_timestamp).

      Because of the way in which this data was captured via "snapshots", we do not have exact
      timestamps for membership events, although we can make certain
      guarantees about the true event time, given the type of event and when it was snapshotted.
      As such, this table is not suitable for permission auditing, although it may still
      be useful for approximating team membership at an arbitrary time.
      
      The type of event is specified by a records `event_type`. Event times are approximated
      by the `approximate_event_timestamp` field according to the following rules:
      
      * `join` snapshot timestamps are the most nuanced, but also generally the closest
      to the actual event time. In the majority of cases, the `snapshot_timestamp` of a 
      join event is practically equivalent to the true event timestamp. In more complicated
      cases, where a team was snapshotted repeatedly within overlapping 60-second windows,
      the `snapshot_timestamp` of an event may be earlier than the true event timestamp.
      The worst case we saw in historical data spanning from 2021 to late 2026 is a potential 
      backdate of 7 minutes and 50 seconds of a join event. As a rule-of-thumb, you can 
      treat the `snapshot_timestamp` to be a lower bound on the true
      join event timestamp -- but it's important to note that we aren't able to make
      strict guarantees. A join event may be backdated arbitrarily far in the
      past in exceptional circumstances, particularly if many users are joining a team
      in overlapping 60-second time windows.
      * `update` snapshot timestamps are an upper bound on the true event timestamp,
      usually up to 7 days, but potentially up to a month or more in exceptional circumstances.
      * `depart` snapshot timestamps provide the same guarantees as `update` timestamps.
      They are an upper bound on the true event timestamp, usually up to 7 days, but
      potentially up to a month or more in exceptional circumstances.

      In rare circumstances where an `update` or `depart` event happened within a 60-second
      window of a join event, it may be backdated according to the same behavior as the
      `join` event. Again -- do not use this table for auditing! If your analysis is too
      sensitive for the margins of error desribed above, we strongly discourage the use of
      this table.

      Additionally, we only have snapshots back to 2022-01-05. Users which were already
      members of a team at this point in time have a `join` event record on this date,
      although the true join date may be much further in the past.
    constraints:
      - type: primary_key
        columns: [team_id, user_id, snapshot_timestamp]
    columns:
      - name: team_id
        data_type: NUMBER
        description: |
          Synapse team identifier.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: user_id
        data_type: NUMBER
        description: |
          Synapse user identifier for the team member.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: snapshot_timestamp
        data_type: TIMESTAMP_NTZ
        description: |
          UTC time of the earliest member row in the reconstructed team capture group; an observation time rather than an exact change time.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: event_type
        data_type: VARCHAR
        description: |
          Observed transition: join when newly present, update when a continuing member changes manager status, or leave when absent from the next reconstructed team capture.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['join', 'update', 'leave']
      - name: is_admin
        data_type: BOOLEAN
        description: |
          Manager status after a join or update; null for a leave. A null source value remains unknown.
