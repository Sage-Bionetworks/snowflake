version: 2
models:
  - name: accessor_change_event
    description: >-
      This table contains gains, renewals, and revocations of user access established by approved
      data access submissions. One row represents an approved submission and accessor, uniquely
      identified by data_access_submission_id and accessor_id. Changes are dated by approval and
      remain in the history even if later changes supersede them; this table does not describe
      current access. Submitted, Rejected, and Cancelled requests are excluded. Approved changes
      remain included when historical requirement terms or expiration are unavailable.
    constraints:
      - type: primary_key
        columns: [data_access_submission_id, accessor_id]
      - type: foreign_key
        columns: [data_access_submission_id, accessor_id]
        to: ref('int_synapse_accessor_changes')
        to_columns: [data_access_submission_id, accessor_id]
        warn_unenforced: false
      - type: foreign_key
        columns: [access_requirement_id, access_requirement_version]
        to: ref('int_synapse_access_requirement')
        to_columns: [access_requirement_id, access_requirement_version]
        warn_unenforced: false
    columns:
      - name: data_access_submission_id
        description: >-
          PRIMARY KEY (Composite). The unique identifier of the approved data access submission that
          established this change.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: accessor_id
        description: >-
          PRIMARY KEY (Composite). The unique identifier of the Synapse user whose access changed.
          The accessor need not be the user who submitted the request.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: accessor_change_type
        description: >-
          The access change established by approval. GAIN_ACCESS grants new access; RENEW_ACCESS
          renews existing access; REVOKE_ACCESS removes access.
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS']
      - name: access_requirement_id
        description: >-
          The unique identifier of the access requirement.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: >-
          The access requirement revision selected for the submission review. Uses the latest
          available revision modified at or before the approval timestamp, breaking
          modification-time ties by the largest revision number. NULL when no eligible revision is
          available. Join to int_synapse_access_requirement on access_requirement_id and
          access_requirement_version to inspect the selected terms.
        data_type: NUMBER
      - name: change_established_on
        description: >-
          The UTC timestamp when the submission was approved and this access change was established.
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: access_expires_on
        description: >-
          The estimated UTC expiration timestamp of gained or renewed access. Calculated as the
          approval timestamp plus the positive expiration period of the requirement revision
          selected at review time; Synapse calculates expiration before recording the approval
          status timestamp, so this is an approximation. NULL for revocations, zero (unlimited),
          missing, or negative expiration periods, or when no eligible requirement revision is
          available. Later requirement revisions do not by themselves recalculate this expiration,
          and later accessor changes can supersede the grant.
        data_type: TIMESTAMP_NTZ

  - name: data_access_submission_event
    description: "This event table contains all data access submissions and their associated state. A data access submission is created each time a user makes a revision of their data access request."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: data_access_request_id
        description: "The identifier of the access request that this submission was created from."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The identifier of the access requirement that the access request associates with."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: research_project_id
        description: "The research project associated with this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who made this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by_user_name
        description: "Username of the user who made this submission."
        data_type: VARCHAR
      - name: created_on
        description: "UTC timestamp when the submission was created."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state_modified_by
        description: "Identifier of the user who last modified the submission status."
        data_type: NUMBER
      - name: state_modified_by_user_name
        description: "Username of the user who last modified the submission status."
        data_type: VARCHAR
      - name: state_modified_on
        description: "UTC timestamp when the submission status was last modified."
        data_type: TIMESTAMP_NTZ
      - name: state
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
      - name: submission_type
        description: "Submission classification. One of: 'New', 'Update', or 'Annual Renewal'. A submission is 'New' when it is the first submission for the data access request or when no previously approved submission exists for that request. A submission is 'Update' when the most recently approved submission associated with the data access request was approved less than 10 months before the current submission was created. A submission is 'Annual Renewal' when the most recently approved submission associated with the data access request was approved more than 10 months before this submission was created."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: state_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations. Null for records before 2019 due to invalid utf-8 characters."
        data_type: VARCHAR
      - name: accessor_changes
        description: "A mapping of principal IDs (as strings) to their access type changes (e.g., {'123': 'GAIN_ACCESS', '456': 'RENEW_ACCESS'}). Access types include: 'GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS'"
        data_type: VARIANT
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object."
        data_type: BINARY
        constraints:
          - type: not_null

  - name: accessrequirement_event
    description: |-
      Historical revisions of Synapse access requirements. One row represents a revision,
      uniquely identified by `access_requirement_id` and `access_requirement_version`.
      The history includes available revisions of requirements still present in Synapse.
      `modified_on` records when the revision was created. Deletion events are unavailable.
    constraints:
      - type: primary_key
        columns: [access_requirement_id, access_requirement_version]
    columns:
      - name: access_requirement_id
        description: >-
          PRIMARY KEY (Composite). The unique identifier of the access requirement.
        data_type: NUMBER
        data_tests:
          - not_null
      - name: access_requirement_version
        description: >-
          PRIMARY KEY (Composite). The revision number of the access requirement. Revision numbers
          begin at 0.
        data_type: NUMBER
        data_tests:
          - not_null
      - name: access_requirement_name
        description: >-
          The human-readable name of the access requirement at this revision. Uses the name recorded
          in the revision. at the current revision, falls back to the requirement's name when the
          revision records none. NULL for earlier revisions without a recorded name and for
          requirements that were never named (Synapse stores an empty string or the requirement ID
          as a placeholder).
        data_type: VARCHAR
      - name: access_requirement_type
        description: >-
          The unqualified class name identifying the access requirement type at this revision, such
          as ManagedACTAccessRequirement.
        data_type: VARCHAR
      - name: created_by
        description: >-
          The unique identifier of the user who initially created the access requirement.
        data_type: NUMBER
      - name: created_on
        description: >-
          The UTC timestamp when the access requirement was initially created.
        data_type: TIMESTAMP_NTZ
      - name: modified_by
        description: >-
          The unique identifier of the user who created this access requirement revision.
        data_type: NUMBER
      - name: modified_on
        description: >-
          The UTC timestamp when this access requirement revision was created.
        data_type: TIMESTAMP_NTZ
      - name: is_two_fa_required
        description: >-
          If true, accessors must use two-factor authentication to satisfy this access requirement
          revision.
        data_type: BOOLEAN
      - name: is_certified_user_required
        description: >-
          If true, accessors must be Synapse Certified Users to satisfy this revision.
        data_type: BOOLEAN
      - name: is_validated_profile_required
        description: >-
          If true, accessors must have validated Synapse profiles to satisfy this revision.
        data_type: BOOLEAN
      - name: is_duc_required
        description: >-
          If true, this revision requires a signed Data Use Certificate.
        data_type: BOOLEAN
      - name: is_irb_approval_required
        description: >-
          If true, this revision requires an Institutional Review Board approval document.
        data_type: BOOLEAN
      - name: are_other_attachments_required
        description: >-
          If true, this revision requires attachments in addition to Data Use Certificate and
          Institutional Review Board documents.
        data_type: BOOLEAN
      - name: is_idu_required
        description: >-
          If true, this revision requires an Intended Data Use statement.
        data_type: BOOLEAN
      - name: is_idu_public
        description: >-
          If true, this revision makes submitted Intended Data Use statements public.
        data_type: BOOLEAN
      - name: access_requirement_access_type
        description: >-
          The permission controlled by the access requirement at this revision, such as DOWNLOAD or
          PARTICIPATE. NULL when the revision records no value.
        data_type: VARCHAR
      - name: expiration_period
        description: >-
          The validity period of approved access under this revision, in milliseconds. Zero means no
          expiration. NULL when the value is unavailable. Negative values are retained here but do
          not produce an expiration timestamp downstream.
        data_type: NUMBER
      - name: description
        description: >-
          The descriptive text recorded for the access requirement at this revision. NULL when the
          revision records no value.
        data_type: VARCHAR
      - name: etag
        description: >-
          The entity tag recorded for this access requirement revision. NULL when the revision
          records no value.
        data_type: VARCHAR
      - name: url
        description: >-
          The URL recorded for the access requirement at this revision, for example a link to an
          external participation requirement. NULL when the revision records no value.
        data_type: VARCHAR
      - name: terms_of_use
        description: >-
          The terms of use text recorded for the access requirement at this revision. NULL when the
          revision records no value.
        data_type: VARCHAR
      - name: duc_template_file_handle_id
        description: >-
          The unique identifier of the file handle containing the Data Use Certificate template for
          this revision. NULL when the value is unavailable.
        data_type: NUMBER
      - name: e_duc_template_id
        description: >-
          The identifier of the electronic Data Use Certificate template for this revision.
          Identifiers may be UUIDs. NULL when the revision records no value.
        data_type: VARCHAR
      - name: jira_key
        description: >-
          The Jira issue key recorded for this access requirement revision. NULL when the revision
          records no value.
        data_type: VARCHAR
      - name: act_contact_info
        description: >-
          The Access and Compliance Team contact information recorded for this access requirement
          revision. NULL when the revision records no value.
        data_type: VARCHAR
      - name: open_jira_issue
        description: >-
          If true, this revision requests opening a Jira issue.
        data_type: BOOLEAN
      - name: subjects_defined_by_annotations
        description: >-
          If true, this revision defines its subjects through annotations.
        data_type: BOOLEAN
      - name: form_template_id
        description: >-
          The identifier of the form template referenced by this revision's formTemplateRef. NULL
          when the value is unavailable.
        data_type: NUMBER
      - name: form_template_version
        description: >-
          The version of the form template referenced by this revision's formTemplateRef. NULL when
          the value is unavailable.
        data_type: NUMBER
      - name: subject_ids
        description: >-
          The subjects governed by this access requirement revision, represented as an ordered array
          of objects with string id and type fields. An empty array when subjectIds is absent or
          explicitly empty. Non-object entries are omitted, and absent id or type fields are omitted
          from individual objects.
        data_type: ARRAY
