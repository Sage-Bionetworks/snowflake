version: 2
models:
  - name: data_access_submission_event
    description: "This event table contains all data access submissions and their associated state. A data access submission is created each time a user makes a revision of their data access request."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: data_access_request_id
        description: "The identifier of the access request that this submission was created from."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The identifier of the access requirement that the access request associates with."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: research_project_id
        description: "The research project associated with this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who made this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by_user_name
        description: "Username of the user who made this submission."
        data_type: VARCHAR
      - name: created_on
        description: "UTC timestamp when the submission was created."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state_modified_by
        description: "Identifier of the user who last modified the submission status."
        data_type: NUMBER
      - name: state_modified_by_user_name
        description: "Username of the user who last modified the submission status."
        data_type: VARCHAR
      - name: state_modified_on
        description: "UTC timestamp when the submission status was last modified."
        data_type: TIMESTAMP_NTZ
      - name: state
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
      - name: submission_type
        description: "Submission classification. One of: 'New', 'Update', or 'Annual Renewal'. A submission is 'New' when it is the first submission for the data access request or when no previously approved submission exists for that request. A submission is 'Update' when the most recently approved submission associated with the data access request was approved less than 10 months before the current submission was created. A submission is 'Annual Renewal' when the most recently approved submission associated with the data access request was approved more than 10 months before this submission was created."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: state_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations. Null for records before 2019 due to invalid utf-8 characters."
        data_type: VARCHAR
      - name: accessor_changes
        description: "A mapping of principal IDs (as strings) to their access type changes (e.g., {'123': 'GAIN_ACCESS', '456': 'RENEW_ACCESS'}). Access types include: 'GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS'"
        data_type: VARIANT
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object."
        data_type: BINARY
        constraints:
          - type: not_null

  - name: teammember_event
    description: |
      Membership history for every observed Synapse team, derived from
      SYNAPSE_RAW.TEAMMEMBERSNAPSHOTS and materialized as a dynamic table with
      full refresh. Each row represents a join, manager-status update, or leave;
      unchanged membership is omitted. The key is (team_id, user_id, snapshot_timestamp).

      A member in a team's first capture receives a join at that capture time.
      The Sage team history described in SNOW-498 starts on 2022-01-05. Actual
      join dates for existing members and membership before a team's first
      observed capture are unknown. Joins trigger captures,
      so their observation times are usually close to the join. Departures and
      manager changes are observed only at a later capture: their timestamps are
      upper bounds on the actual change, which can occur after the previous capture.
      Periodic captures are usually weekly, but the Sage team (273957) has shown
      gaps as long as 28 days. Manager updates from 2023-11-14 through 2023-11-17
      may reflect a bulk Glue artifact rather than real promotions. These events
      are retained. Departures leaving a team with no captured members cannot
      be inferred from this source.

      Capture boundaries are reconstructed from timestamps, not calendar buckets.
      Within each team, a gap of at least 60,000 milliseconds between adjacent
      distinct timestamps starts a new group. Smaller gaps keep rows together
      even across clock and date boundaries, preserving separate same-day captures
      when their timestamps are separated by at least 60 seconds. A chain of
      smaller gaps can span more than 60 seconds. Each group uses its earliest
      timestamp, and each member's latest row supplies manager status. This is
      a heuristic: nearby separate captures may merge, and a pause of at least
      60 seconds within a capture may split it and create false membership events.
      Merging captures retains their combined membership and the latest observed
      manager status for each member. It can hide departures and rejoins or
      intermediate manager changes. Joins and manager updates can be backdated
      to before the actual change, so their reconstructed timestamps are not
      guaranteed upper bounds. Departures may be delayed until a later group.

      For membership at time T, filter to the desired team and to join/leave events,
      then compute LEAD(snapshot_timestamp) over (PARTITION BY team_id, user_id
      ORDER BY snapshot_timestamp) before keeping only joins. Each join starts a
      half-open interval [join, next leave); a null end means still observed as a
      member. Ignore update events when constructing membership intervals. To
      exclude members from activity queries, put both the user match and interval
      bounds in a LEFT JOIN and retain rows whose joined user_id is null. This
      handles users with multiple membership periods.
    constraints:
      - type: primary_key
        columns: [team_id, user_id, snapshot_timestamp]
    columns:
      - name: team_id
        data_type: NUMBER
        description: |
          Synapse team identifier.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: user_id
        data_type: NUMBER
        description: |
          Synapse user identifier for the team member.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: snapshot_timestamp
        data_type: TIMESTAMP_NTZ
        description: |
          UTC time of the earliest member row in the reconstructed team capture group; an observation time rather than an exact change time.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: event_type
        data_type: VARCHAR
        description: |
          Observed transition: join when newly present, update when a continuing member changes manager status, or leave when absent from the next reconstructed team capture.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['join', 'update', 'leave']
      - name: is_admin
        data_type: BOOLEAN
        description: |
          Manager status after a join or update; null for a leave. A null source value remains unknown.
