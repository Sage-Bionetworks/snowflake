version: 2
models:
  - name: accessor_change_event
    description: >-
      This table contains gains, renewals, and revocations of user access established by approved
      data access submissions. One row represents an approved submission and accessor, uniquely
      identified by data_access_submission_id and accessor_id. Changes are dated by approval and
      remain in the history even if later changes supersede them; this table does not describe
      current access. Submitted, Rejected, and Cancelled requests are excluded. Approved changes
      remain included when historical requirement terms or expiration are unavailable.
    constraints:
      - type: primary_key
        columns: [data_access_submission_id, accessor_id]
      - type: foreign_key
        columns: [data_access_submission_id, accessor_id]
        to: ref('int_synapse_accessor_changes')
        to_columns: [data_access_submission_id, accessor_id]
        warn_unenforced: false
      - type: foreign_key
        columns: [access_requirement_id, access_requirement_version]
        to: ref('int_synapse_access_requirement')
        to_columns: [access_requirement_id, access_requirement_version]
        warn_unenforced: false
    columns:
      - name: data_access_submission_id
        description: >-
          PRIMARY KEY (Composite). The unique identifier of the approved data access submission that
          established this change.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: accessor_id
        description: >-
          PRIMARY KEY (Composite). The unique identifier of the Synapse user whose access changed.
          The accessor need not be the user who submitted the request.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: accessor_change_type
        description: >-
          The access change established by approval. GAIN_ACCESS grants new access; RENEW_ACCESS
          renews existing access; REVOKE_ACCESS removes access.
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS']
      - name: access_requirement_id
        description: >-
          The unique identifier of the access requirement.
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: >-
          The access requirement revision selected for the submission review. Uses the latest
          available revision modified at or before the approval timestamp, breaking
          modification-time ties by the largest revision number. NULL when no eligible revision is
          available. Join to int_synapse_access_requirement on access_requirement_id and
          access_requirement_version to inspect the selected terms.
        data_type: NUMBER
      - name: change_established_on
        description: >-
          The UTC timestamp when the submission was approved and this access change was established.
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: access_expires_on
        description: >-
          The estimated UTC expiration timestamp of gained or renewed access. Calculated as the
          approval timestamp plus the positive expiration period of the requirement revision
          selected at review time; Synapse calculates expiration before recording the approval
          status timestamp, so this is an approximation. NULL for revocations, zero (unlimited),
          missing, or negative expiration periods, or when no eligible requirement revision is
          available. Later requirement revisions do not by themselves recalculate this expiration,
          and later accessor changes can supersede the grant.
        data_type: TIMESTAMP_NTZ

  - name: data_access_submission_event
    description: "This event table contains all data access submissions and their associated state. A data access submission is created each time a user makes a revision of their data access request."
    constraints:
      - type: primary_key
        columns: [data_access_submission_id]
    columns:
      - name: data_access_submission_id
        description: "Unique identifier for the data access submission."
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
      - name: data_access_request_id
        description: "The identifier of the access request that this submission was created from."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_id
        description: "The identifier of the access requirement that the access request associates with."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: access_requirement_version
        description: "Version of the access requirement at the time of submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: research_project_id
        description: "The research project associated with this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by
        description: "Identifier of the user who made this submission."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: created_by_user_name
        description: "Username of the user who made this submission."
        data_type: VARCHAR
      - name: created_on
        description: "UTC timestamp when the submission was created."
        data_type: TIMESTAMP_NTZ
        constraints:
          - type: not_null
      - name: state_modified_by
        description: "Identifier of the user who last modified the submission status."
        data_type: NUMBER
      - name: state_modified_by_user_name
        description: "Username of the user who last modified the submission status."
        data_type: VARCHAR
      - name: state_modified_on
        description: "UTC timestamp when the submission status was last modified."
        data_type: TIMESTAMP_NTZ
      - name: state
        description: "Current state in the submission workflow. One of: 'Submitted', 'Approved', 'Rejected', 'Cancelled'"
        data_type: VARCHAR
      - name: submission_type
        description: "Submission classification. One of: 'New', 'Update', or 'Annual Renewal'. A submission is 'New' when it is the first submission for the data access request or when no previously approved submission exists for that request. A submission is 'Update' when the most recently approved submission associated with the data access request was approved less than 10 months before the current submission was created. A submission is 'Annual Renewal' when the most recently approved submission associated with the data access request was approved more than 10 months before this submission was created."
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: weekdays_to_review
        description: |-
          Number of weekdays (Monday–Friday) from submission to a review decision (Approved or Rejected), excluding the submission date and including the decision date, so same-day reviews are 0. Includes weekday holidays. NULL for Submitted or Cancelled submissions.

          Examples using UTC dates: submitted on Friday and reviewed the following Saturday yields 0 weekdays, because the submission date is excluded and Saturday is not a weekday. Submitted on Saturday and reviewed the following Monday yields 1 weekday, because Monday is counted and the weekend is excluded.

          *This text was generated in whole or part by AI and has been reviewed for correctness by myself.*
        data_type: NUMBER
      - name: state_reason
        description: "UTF-8 encoded string containing an explanation for the current state, particularly for rejections or cancellations. Null for records before 2019 due to invalid utf-8 characters."
        data_type: VARCHAR
      - name: accessor_changes
        description: "A mapping of principal IDs (as strings) to their access type changes (e.g., {'123': 'GAIN_ACCESS', '456': 'RENEW_ACCESS'}). Access types include: 'GAIN_ACCESS', 'RENEW_ACCESS', 'REVOKE_ACCESS'"
        data_type: VARIANT
      - name: data_access_submission_raw
        description: "Serialized representation of the complete submission object."
        data_type: BINARY
        constraints:
          - type: not_null

  - name: teammember_event
    description: |
      Membership history for every Synapse team.
      Each row represents a join, team manager promotion or demotion, or departure event.
      The key is (team_id, user_id, approximate_event_timestamp).

      Because of the way in which this data was captured via "snapshots", we do not have exact
      timestamps for membership events, although we can make certain
      guarantees about the true event time, given the type of event and when it was snapshotted.
      As such, this table is not suitable for permission auditing, although it may still
      be useful for approximating team membership at an arbitrary time.

      The type of event is specified by each record's `event_type`. Event times are approximated
      by the `approximate_event_timestamp` field according to the following rules:

      * `join` snapshot timestamps are the most nuanced, but also generally the closest
      to the actual event time. In the majority of cases, the `approximate_event_timestamp` of a
      join event is practically equivalent to the true event timestamp. In more complicated
      cases, where a team was snapshotted repeatedly within overlapping 60-second windows,
      the `approximate_event_timestamp` of an event may be earlier than the true event timestamp.
      The largest potential backdate observed in data from 2022 to late 2026 was
      7 minutes and 50 seconds. Joins are usually recorded at or shortly after the
      true join time, but chained captures can move the timestamp earlier.
      * `update` snapshot timestamps are an upper bound on the true event timestamp,
      usually up to 7 days, but potentially up to a month or more in exceptional circumstances.
      * `depart` snapshot timestamps provide the same guarantees as `update` timestamps.
      They are an upper bound on the true event timestamp, usually up to 7 days, but
      potentially up to a month or more in exceptional circumstances.

      In rare circumstances where an `update` or `depart` event happened within a 60-second
      window of a join event, it may be backdated according to the same behavior as the
      `join` event. Again -- do not use this table for auditing! If your analysis is too
      sensitive to the margins of error described above, we strongly discourage the use of
      this table.

      Snapshots begin on 2022-01-05. Members already present in a team's earliest
      capture receive a `join` at that capture, which may be later than their true join.

      Thousands of team memberships first report `is_admin = true` during
      2023-11-14 through 2023-11-17. Treat manager-status updates around that
      discontinuity as potentially reflecting a change in the source data.

      To estimate membership at a given time, build a separate interval for each
      `join` within each `(team_id, user_id)` pair. Use only `join` and `depart`
      events to compute interval boundaries. Include the join timestamp and
      exclude the departure timestamp. An interval without a recorded departure
      has no observed end.

      When a team is deleted, there is no later membership snapshot for that
      team. The model therefore emits no `depart` events for members still in
      the last snapshot, and their membership intervals remain open.
    constraints:
      - type: primary_key
        columns: [team_id, user_id, approximate_event_timestamp]
      - type: foreign_key
        columns: [team_id, user_id, approximate_event_timestamp]
        to: ref('int_synapse_teammember_event')
        to_columns: [team_id, user_id, approximate_event_timestamp]
        warn_unenforced: false
    columns:
      - name: team_id
        data_type: NUMBER
        description: |
          Synapse team identifier.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: user_id
        data_type: NUMBER
        description: |
          Synapse user identifier for the team member.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: approximate_event_timestamp
        data_type: TIMESTAMP_NTZ
        description: |
          UTC start of the reconstructed team capture group that first showed the transition.
          For a depart event, this is the start of the first subsequent group without the user.
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: event_type
        data_type: VARCHAR
        description: |
          Observed transition: join when newly present, update when a continuing member's recorded
          manager status changes (including to or from null), or depart when absent from the next
          reconstructed team capture.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['join', 'update', 'depart']
      - name: is_admin
        data_type: BOOLEAN
        description: |
          Manager status after a join or update; null for a depart event. A null source value remains unknown.
