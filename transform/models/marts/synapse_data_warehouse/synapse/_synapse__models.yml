version: 2
models:
  - name: research_project
    description: "One row per research project, enriched with the current access requirement name and creator and modifier usernames."
    constraints:
      - type: primary_key
        columns: [research_project_id]
    columns:
      - name: research_project_id
        description: "Unique identifier for the research project"
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: unique
          - type: foreign_key
            to: ref('int_synapse_research_project')
            to_columns: [research_project_id]
            warn_unenforced: false
      - name: access_requirement_id
        description: "Identifier of the access requirement associated with this research project"
        data_type: NUMBER
        constraints:
          - type: foreign_key
            to: ref('stg_synapse__access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
      - name: access_requirement_name
        description: "Current name of the associated access requirement"
        data_type: VARCHAR
      - name: created_by
        description: "Identifier of the user who created this research project"
        data_type: NUMBER
      - name: created_by_user_name
        description: "Current username of the user who created this research project; null when no username is available"
        data_type: VARCHAR
      - name: created_on
        description: "UTC timestamp when the research project was created"
        data_type: TIMESTAMP_NTZ
      - name: modified_by
        description: "Identifier of the user who last modified this research project"
        data_type: NUMBER
      - name: modified_by_user_name
        description: "Current username of the user who last modified this research project; null when no username is available"
        data_type: VARCHAR
      - name: modified_on
        description: "UTC timestamp when the research project was last modified"
        data_type: TIMESTAMP_NTZ
      - name: etag
        description: "Entity tag for optimistic concurrency control (36-character UUID)"
        data_type: VARCHAR
      - name: project_lead
        description: "Name of the principal investigator or project lead"
        data_type: VARCHAR
      - name: institution
        description: "Name of the institution affiliated with this research project"
        data_type: VARCHAR
      - name: intended_data_use
        description: "Intended data use statement decoded from UTF-8 binary into text"
        data_type: VARCHAR
  - name: accessrequirement_latest
    config:
      copy_grants: true
    description: |-
      Current Synapse access requirements and the rules users must meet to gain access.
      There is one row per access requirement, uniquely identified by `id`.
      Each row describes the revision currently in effect. A requirement is included
      when its current revision is available.
    constraints:
    - type: primary_key
      columns:
      - id
    columns:
    - name: id
      description: >-
        PRIMARY KEY. Unique identifier of the access requirement.
      data_type: NUMBER
      constraints:
      - type: not_null
      data_tests:
      - not_null
      - unique
    - name: version_number
      description: >-
        Revision number currently in effect.
      data_type: NUMBER
    - name: name
      description: >-
        Current name of the access requirement.
      data_type: VARCHAR
    - name: description
      description: >-
        Description of the current revision.
      data_type: VARCHAR
    - name: created_by
      description: >-
        Synapse user ID of the requirement creator.
      data_type: NUMBER
    - name: modified_by
      description: >-
        Synapse user ID of the person who modified the current revision.
      data_type: NUMBER
    - name: created_on
      description: >-
        Time the requirement was created, in UTC.
      data_type: TIMESTAMP_NTZ
    - name: modified_on
      description: >-
        Time the current revision was modified, in UTC.
      data_type: TIMESTAMP_NTZ
    - name: access_type
      description: >-
        Kind of access governed by the requirement, such as DOWNLOAD for entities or PARTICIPATE for teams.
      data_type: VARCHAR
    - name: concrete_type
      description: >-
        Synapse access requirement type, expressed as a fully qualified class name.
      data_type: VARCHAR
    - name: subjects_defined_by_annotations
      description: >-
        If true, Synapse infers the governed objects from annotations. NULL means the setting is unavailable.
      data_type: BOOLEAN
    - name: subjects_ids
      description: >-
        Objects governed by the requirement, such as entities or teams. The array is empty when the revision lists no subjects.
      data_type: ARRAY
    - name: duc_template_file_handle_id
      description: >-
        File handle ID of the Data Use Certificate template. NULL means no template ID is available.
      data_type: NUMBER
    - name: jira_key
      description: >-
        Jira issue key recorded on the current revision. NULL means no key is recorded.
      data_type: VARCHAR
    - name: act_contact_info
      description: >-
        Contact instructions for the Access and Compliance Team. NULL means no instructions are recorded.
      data_type: VARCHAR
    - name: open_jira_issue
      description: >-
        If true, the requirement calls for opening a Jira issue.
      data_type: BOOLEAN
    - name: is_certified_user_required
      description: >-
        If true, users must be Synapse Certified Users.
      data_type: BOOLEAN
    - name: is_validated_profile_required
      description: >-
        If true, users must have a validated Synapse profile.
      data_type: BOOLEAN
    - name: is_duc_required
      description: >-
        If true, users must provide a signed Data Use Certificate.
      data_type: BOOLEAN
    - name: is_irb_approval_required
      description: >-
        If true, users must provide Institutional Review Board approval.
      data_type: BOOLEAN
    - name: are_other_attachments_required
      description: >-
        If true, users must provide additional attachments.
      data_type: BOOLEAN
    - name: is_idu_required
      description: >-
        If true, users must submit an Intended Data Use statement.
      data_type: BOOLEAN
    - name: is_idu_public
      description: >-
        If true, submitted Intended Data Use statements are made public.
      data_type: BOOLEAN
    - name: expiration_period
      description: >-
        How long an access approval lasts, in milliseconds. Zero means the approval does not expire. NULL means no duration is available.
      data_type: NUMBER
    - name: is_two_fa_required
      description: >-
        If true, users must use two-factor authentication. NULL means the setting is unavailable. This flag typically has no effect, since 2FA is required Synapse-wide.
      data_type: BOOLEAN
    - name: terms_of_user
      description: >-
        Terms of use text for the current revision.
      data_type: VARCHAR