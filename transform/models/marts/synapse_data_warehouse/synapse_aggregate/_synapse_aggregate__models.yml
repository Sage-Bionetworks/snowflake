version: 2
models:
  - name: data_access_submission_aggregate
    description: >
      This table contains aggregate statistics over data access submissions associated with a given access requirement.
      Aggregates are computed for daily, monthly, quarterly, yearly, and all-time grains (see `agg_period`).
      Any columns in this table which contain information about the aggregate itself, such as the particular 
      period, date, or the access requirement ID have their column name prefixed with `agg_`.
      Columns which represent aggregate statistics, such as submission volume, review outcome
      counts, and review latency, lack this prefix. In this way, it is easy
      to differentiate between columns that contain information about the dates we are aggregating over,
      and columns which contain the resulting statistics.

      Each aggregate statistic consists of events which transpired during the given time period.
      For example, `received_count` consists of all submission created within the time period; whereas
      every other metric consists of submissions that reached their terminal state within the time period.
      A submission received in March and approved in June therefore increments March's
      `received_count` and June's `approved_count`. Because states are terminal in Synapse —
      an Approved, Rejected, or Cancelled submission never changes state again — a metric
      attributed to a past date cannot be revised by anything that happens later, so once
      `agg_period_is_complete` is TRUE the row is final.

      The consequence of event dating is that a single row does not describe a single population:
      `received_count` counts submissions that arrived in the period, while `approved_count`
      counts submissions approved in the period, and these are disjoint sets of submissions.
      `approved_count / received_count` is therefore a throughput ratio, NOT an approval rate,
      and this table cannot answer cohort questions such as "of the submissions received in
      March, what fraction were eventually approved?". Answering that requires a cohort-keyed
      model, not this one.
    constraints:
      - type: primary_key
        columns: [agg_row_id]
    columns:
      - name: agg_row_id
        description: "Unique, deterministic surrogate key hashing the full grain (agg_period, agg_year, agg_quarter, agg_month, agg_day, agg_access_requirement_id). The model's enforced primary key."
        data_type: VARCHAR
        constraints:
          - type: not_null
          - type: unique
        data_tests:
          - not_null
          - unique
      - name: agg_period
        description: "The time grain of this row. One of: 'ALL TIME', 'YEARLY', 'QUARTERLY', 'MONTHLY', 'DAILY'."
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: agg_year
        description: "Calendar year of the aggregation period. NULL for the 'ALL TIME' grain."
        data_type: NUMBER
      - name: agg_quarter
        description: "Calendar quarter (1-4) of the aggregation period. NULL for the 'YEARLY' and 'ALL TIME' grains."
        data_type: NUMBER
      - name: agg_month
        description: "Calendar month (1-12) of the aggregation period. NULL for the 'QUARTERLY', 'YEARLY', and 'ALL TIME' grains."
        data_type: NUMBER
      - name: agg_day
        description: "Calendar day of month of the aggregation period. NULL for every grain above 'DAILY'."
        data_type: NUMBER
      - name: agg_access_requirement_id
        description: "The access requirement this row is scoped to. "
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('int_synapse_access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
        data_tests:
          - not_null
      - name: agg_period_start
        description: "Inclusive start date of the aggregation period. NULL for the 'ALL TIME' grain, which has no fixed start."
        data_type: DATE
      - name: agg_period_end
        description: "Inclusive end date of the aggregation period. NULL for the 'ALL TIME' grain, which has no fixed end."
        data_type: DATE
      - name: agg_period_is_complete
        description: "TRUE once CURRENT_DATE is past agg_period_end, i.e. no further events can be attributed to this period. Because every metric is dated by the event that produced it, and submission states are terminal, a complete period's metrics are final and will not change on future refreshes. Always FALSE for the 'ALL TIME' grain, which by definition never stops accumulating events."
        data_type: BOOLEAN
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: received_count
        description: "Count of submissions made in this period for this access requirement."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: cancelled_count
        description: "Count of submissions withdrawn in this period."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: approved_count
        description: "Count of submissions approved in this period — i.e., approvals granted during the period, regardless of when the submissions were received."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: rejected_count
        description: "Count of submissions rejected in this period — i.e., rejections issued during the period, regardless of when the submissions were received."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: reviewed_count
        description: "Count of submissions that reached a review decision (Approved or Rejected) in this period. Equals `approved_count` + `rejected_count`. Cancelled submissions are excluded, as a withdrawal is not a review decision."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: sum_days_to_review
        description: "Sum of days between `created_on` and `state_modified_on` across submissions reviewed in this period. Divide by `reviewed_count` downstream to get the average turnaround of reviews completed in the period. NULL if no submissions were reviewed in this period."
        data_type: NUMBER
      - name: sum_attempts_to_approval
        description: "Sum of `attempt`s across submissions approved in this period. Divide by `approved_count` downstream to get the average attempts per approval granted in the period. NULL if no submissions were approved in this period."
        data_type: NUMBER
      - name: max_attempt
        description: "Highest submission attempt in this period. Cancelled submissions do not count as an attempt. NULL if no non-cancelled submission reached a terminal state in this period."
        data_type: NUMBER
