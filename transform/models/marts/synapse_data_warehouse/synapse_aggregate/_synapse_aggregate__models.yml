version: 2
models:
  - name: accessor_change_aggregate
    description: >
      Approved accessor changes aggregated by access requirement, reviewed requirement revision,
      and daily, monthly, quarterly, yearly, or all-time period. Gains, renewals, and revocations
      are dated by approval. Expired users are dated by the expiration of their most recent
      approved gain or renewal at that time, across all revisions of the same requirement.
      A gain or renewal established before or at expiration supersedes the earlier expiration;
      a later gain or renewal preserves it. Revocations are counted separately and do not
      supersede gain or renewal records when determining expirations.
      Expiration is counted only when its timestamp is before CURRENT_DATE.
      Each event type provides a total event count and a distinct-user count within each
      period and requirement revision. Distinct-user counts cannot be summed across
      periods or revisions to obtain a distinct-user total;
      a user can also be counted in multiple event types within the same period.
      Period completeness indicates the calendar period has ended, rather than guaranteeing
      that late-arriving records cannot change its metrics.
      Events with an unknown reviewed requirement revision are excluded. Their grants remain
      in the expiration history so they can supersede an earlier known-revision grant.
    constraints:
      - type: primary_key
        columns: [agg_row_id, agg_access_requirement_id, agg_access_requirement_revision]
      - type: foreign_key
        columns: [agg_access_requirement_id, agg_access_requirement_revision]
        to: ref('int_synapse_access_requirement')
        to_columns: [access_requirement_id, access_requirement_version]
        warn_unenforced: false
    columns:
      - name: agg_row_id
        description: "Deterministic surrogate key hashing the period, calendar dimensions, access requirement ID, and requirement revision."
        data_type: VARCHAR
        constraints:
          - type: not_null
          - type: unique
        data_tests:
          - not_null
          - unique
      - name: agg_period
        description: "Time grain: ALL TIME, YEARLY, QUARTERLY, MONTHLY, or DAILY."
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['ALL TIME', 'YEARLY', 'QUARTERLY', 'MONTHLY', 'DAILY']
      - name: agg_year
        description: "Calendar year of the period. Null for ALL TIME."
        data_type: NUMBER
      - name: agg_quarter
        description: "Calendar quarter (1-4) of the period. Null for YEARLY and ALL TIME."
        data_type: NUMBER
      - name: agg_month
        description: "Calendar month (1-12) of the period. Null for QUARTERLY, YEARLY, and ALL TIME."
        data_type: NUMBER
      - name: agg_day
        description: "Calendar day of month of the period. Null for grains above DAILY."
        data_type: NUMBER
      - name: agg_access_requirement_id
        description: "Identifier of the access requirement for this aggregate."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: agg_access_requirement_revision
        description: "Reviewed access requirement revision associated with the change or expiring gain or renewal."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: agg_period_start
        description: "Inclusive start date of the period. Null for ALL TIME."
        data_type: DATE
      - name: agg_period_end
        description: "Inclusive end date of the period. Null for ALL TIME."
        data_type: DATE
      - name: agg_period_is_complete
        description: "True when CURRENT_DATE is past the period end. Always false for ALL TIME. Indicates calendar completeness; late-arriving records can still revise metrics."
        data_type: BOOLEAN
        constraints:
          - type: not_null
      - name: gain_access_count
        description: "Total approved gains established in the period for this requirement revision."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: gain_access_user_count
        description: "Distinct users with approved gains established in the period for this requirement revision."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: renew_access_count
        description: "Total approved renewals established in the period for this requirement revision."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: renew_access_user_count
        description: "Distinct users with approved renewals established in the period for this requirement revision."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: revoke_access_count
        description: "Total approved revocations established in the period for this requirement revision."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: revoke_access_user_count
        description: "Distinct users with approved revocations established in the period for this requirement revision."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: expired_access_count
        description: "Total inferred gain or renewal expirations in the period for this requirement revision, before CURRENT_DATE, without a superseding gain or renewal established before or at expiration. Repeated expirations of one user are counted separately."
        data_type: NUMBER
        constraints:
          - type: not_null
      - name: expired_access_user_count
        description: "Distinct users whose gain or renewal expired in the period for this requirement revision, before CURRENT_DATE, without a superseding gain or renewal established before or at expiration. Renewals after expiration preserve the earlier count."
        data_type: NUMBER
        constraints:
          - type: not_null

  - name: data_access_submission_aggregate
    description: >
      This table contains aggregate statistics over data access submissions associated with a given access requirement.
      Aggregates are computed for daily, monthly, quarterly, yearly, and all-time grains (see `agg_period`).
      Any columns in this table which contain information about the aggregate itself, such as the particular 
      period, date, or the access requirement ID have their column name prefixed with `agg_`.
      Columns which represent aggregate statistics, such as submission volume, review outcome
      counts, and review latency, lack this prefix. In this way, it is easy
      to differentiate between columns that contain information about the dates we are aggregating over,
      and columns which contain the resulting statistics.

      Each aggregate statistic consists of events which transpired during the given time period.
      For example, `received_count` consists of all submission created within the time period; whereas
      every other metric consists of submissions that reached their terminal state within the time period.
      A submission received in March and approved in June therefore increments March's
      `received_count` and June's `approved_count`. Because states are terminal in Synapse —
      an Approved, Rejected, or Cancelled submission never changes state again — a metric
      attributed to a past date cannot be revised by anything that happens later, so once
      `agg_period_is_complete` is TRUE the row is final.

      The consequence of event dating is that a single row does not describe a single population:
      `received_count` counts submissions that arrived in the period, while `approved_count`
      counts submissions approved in the period, and these are disjoint sets of submissions.
      `approved_count / received_count` is therefore a throughput ratio, NOT an approval rate,
      and this table cannot answer cohort questions such as "of the submissions received in
      March, what fraction were eventually approved?". Answering that requires a cohort-keyed
      model, not this one.
    constraints:
      - type: primary_key
        columns: [agg_row_id]
    columns:
      - name: agg_row_id
        description: "Unique, deterministic surrogate key hashing the full grain (agg_period, agg_year, agg_quarter, agg_month, agg_day, agg_access_requirement_id). The model's enforced primary key."
        data_type: VARCHAR
        constraints:
          - type: not_null
          - type: unique
        data_tests:
          - not_null
          - unique
      - name: agg_period
        description: "The time grain of this row. One of: 'ALL TIME', 'YEARLY', 'QUARTERLY', 'MONTHLY', 'DAILY'."
        data_type: VARCHAR
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: agg_year
        description: "Calendar year of the aggregation period. NULL for the 'ALL TIME' grain."
        data_type: NUMBER
      - name: agg_quarter
        description: "Calendar quarter (1-4) of the aggregation period. NULL for the 'YEARLY' and 'ALL TIME' grains."
        data_type: NUMBER
      - name: agg_month
        description: "Calendar month (1-12) of the aggregation period. NULL for the 'QUARTERLY', 'YEARLY', and 'ALL TIME' grains."
        data_type: NUMBER
      - name: agg_day
        description: "Calendar day of month of the aggregation period. NULL for every grain above 'DAILY'."
        data_type: NUMBER
      - name: agg_access_requirement_id
        description: "The access requirement this row is scoped to. "
        data_type: NUMBER
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('int_synapse_access_requirement')
            to_columns: [access_requirement_id]
            warn_unenforced: false
        data_tests:
          - not_null
      - name: agg_period_start
        description: "Inclusive start date of the aggregation period. NULL for the 'ALL TIME' grain, which has no fixed start."
        data_type: DATE
      - name: agg_period_end
        description: "Inclusive end date of the aggregation period. NULL for the 'ALL TIME' grain, which has no fixed end."
        data_type: DATE
      - name: agg_period_is_complete
        description: "TRUE once CURRENT_DATE is past agg_period_end, i.e. no further events can be attributed to this period. Because every metric is dated by the event that produced it, and submission states are terminal, a complete period's metrics are final and will not change on future refreshes. Always FALSE for the 'ALL TIME' grain, which by definition never stops accumulating events."
        data_type: BOOLEAN
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: received_count
        description: "Count of submissions made in this period for this access requirement."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: cancelled_count
        description: "Count of submissions withdrawn in this period."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: approved_count
        description: "Count of submissions approved in this period — i.e., approvals granted during the period, regardless of when the submissions were received."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: rejected_count
        description: "Count of submissions rejected in this period — i.e., rejections issued during the period, regardless of when the submissions were received."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: reviewed_count
        description: "Count of submissions that reached a review decision (Approved or Rejected) in this period. Equals `approved_count` + `rejected_count`. Cancelled submissions are excluded, as a withdrawal is not a review decision."
        data_type: NUMBER
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: sum_days_to_review
        description: "Sum of days between `created_on` and `state_modified_on` across submissions reviewed in this period. Divide by `reviewed_count` downstream to get the average turnaround of reviews completed in the period. NULL if no submissions were reviewed in this period."
        data_type: NUMBER
      - name: sum_attempts_to_approval
        description: "Sum of `attempt`s across submissions approved in this period. Divide by `approved_count` downstream to get the average attempts per approval granted in the period. NULL if no submissions were approved in this period."
        data_type: NUMBER
      - name: max_attempt
        description: "Highest submission attempt in this period. Cancelled submissions do not count as an attempt. NULL if no non-cancelled submission reached a terminal state in this period."
        data_type: NUMBER
