---
name: Test Changes with Cloned DB

on:
    pull_request:
        types: [ opened, synchronize, reopened, closed ]
        branches:
          - dev

permissions:
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:

    test_with_clone:
        runs-on: ubuntu-latest
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip_cloning') && github.event.pull_request.state == 'open' }}
        environment: dev_restricted
        env:
            # Establish the snowflake account credentials
            SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWSQL_ACCOUNT }}
            SNOWFLAKE_USER: ${{ vars.ADMIN_SERVICE_USER }}
            PRIVATE_KEY_PASSPHRASE: ${{ secrets.ADMIN_SERVICE_PASS_PHRASE }}

            # Source database to clone (SYNAPSE_DATA_WAREHOUSE_DEV in the dev environment)
            SNOWFLAKE_DOMAIN_ORIGINAL: ${{ vars.SNOWFLAKE_SYNAPSE_DATA_WAREHOUSE_DATABASE }}

            # The source db's admin role owns the clone immediately after cloning (see
            # packages/snowclone/), so it's used for the stage-DIRECTORY workaround below.
            SNOWFLAKE_ADMIN_ROLE: "${{ vars.SNOWFLAKE_SYNAPSE_DATA_WAREHOUSE_DATABASE }}_ADMIN"
            SNOWFLAKE_CLONE_ADMIN_ROLE: DATA_ENGINEER

            # Stage/integration variables consumed by synapse_data_warehouse/schemachange-config.yml
            # during the deploy phase of the procurement script.
            SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWSQL_WAREHOUSE }}
            SNOWFLAKE_SYNAPSE_STAGE_STORAGE_INTEGRATION: ${{ vars.SNOWFLAKE_SYNAPSE_STAGE_STORAGE_INTEGRATION }}
            SNOWFLAKE_SYNAPSE_STAGE_URL: ${{ vars.SNOWFLAKE_SYNAPSE_STAGE_URL }}
            SNOWFLAKE_SNAPSHOTS_STAGE_STORAGE_INTEGRATION: ${{ vars.SNOWFLAKE_SNAPSHOTS_STAGE_STORAGE_INTEGRATION }}
            SNOWFLAKE_SNAPSHOTS_STAGE_URL: ${{ vars.SNOWFLAKE_SNAPSHOTS_STAGE_URL }}
            STACK: ${{ vars.STACK }}

        steps:
            - uses: actions/checkout@v6

            - name: Configure Snowflake
              uses: ./.github/actions/configure-snowflake-cli
              with:
                  PRIVATE_KEY_PASSPHRASE: ${{ secrets.ADMIN_SERVICE_PASS_PHRASE }}
                  PRIVATE_KEY: ${{ secrets.ADMIN_SERVICE_PRIVATE_KEY }}
                  ACCOUNT: ${{ secrets.SNOWSQL_ACCOUNT }}
                  USER: ${{ vars.ADMIN_SERVICE_USER }}

            # Procure an RBAC-configured zero-copy clone. The schemachange deploy is run as
            # a separate step below (rather than via --deploy-folder here) so the
            # stage-DIRECTORY workaround can run in between, before schemachange/dbt touch
            # the clone. The script discovers the ownership hierarchy at runtime, so it
            # auto-adapts when schemas are added — no per-schema maintenance of this
            # workflow is needed. `uv run` syncs the workspace (installs the snowclone
            # package + its connector).
            - name: Procure clone
              id: procure
              shell: bash
              env:
                CLONE_SUFFIX: ${{ github.head_ref }}
              run: |
                uv run --package snowclone --frozen --no-build snowclone freeze \
                  --database "$SNOWFLAKE_DOMAIN_ORIGINAL" \
                  --clone-suffix "$CLONE_SUFFIX" \
                  --developer-role "$SNOWFLAKE_CLONE_ADMIN_ROLE"

            - name: Re-enable DIRECTORY on cloned S3 external stages before schemachange
              shell: bash
              env:
                CLONE_DB: ${{ steps.procure.outputs.clone_db }}
              run: |
                # Zero-copy cloning copies a stage's DDL (including DIRECTORY = (ENABLE = TRUE)) but not the
                # directory table's file-listing metadata. REFRESH can fail/no-op on the fresh clone until
                # DIRECTORY is explicitly re-enabled here, before schemachange/dbt run against the clone.
                snow sql --role $SNOWFLAKE_ADMIN_ROLE -q "ALTER STAGE IF EXISTS ${CLONE_DB}.RDS_LANDING.RDS_SNAPSHOTS_STAGE SET DIRECTORY = (ENABLE = TRUE);"
                snow sql --role $SNOWFLAKE_ADMIN_ROLE -q "ALTER STAGE IF EXISTS ${CLONE_DB}.RDS_LANDING.RDS_SNAPSHOTS_STAGE REFRESH;"

                # Skipped: this stage currently holds 3.26M+ files, and a full-stage REFRESH (no SUBPATH)
                # exceeds Snowflake's ~1GB file-descriptor metadata cap per call (error 001057), so it cannot
                # succeed here regardless of cloning. Needs a SUBPATH-scoped refresh strategy to fix properly.
                # TODO [SNOW-556]: Implement SUBPATH-scoped refresh strategy for oversized SYNAPSE_RAW stage.
                # snow sql --role $SNOWFLAKE_ADMIN_ROLE -q "ALTER STAGE IF EXISTS ${CLONE_DB}.SYNAPSE_RAW.${SNOWFLAKE_SYNAPSE_STAGE_STORAGE_INTEGRATION}_STAGE SET DIRECTORY = (ENABLE = TRUE);"
                # snow sql --role $SNOWFLAKE_ADMIN_ROLE -q "ALTER STAGE IF EXISTS ${CLONE_DB}.SYNAPSE_RAW.${SNOWFLAKE_SYNAPSE_STAGE_STORAGE_INTEGRATION}_STAGE REFRESH;"

                snow sql --role $SNOWFLAKE_ADMIN_ROLE -q "ALTER STAGE IF EXISTS ${CLONE_DB}.SYNAPSE_RAW.synapse_filehandles_stage SET DIRECTORY = (ENABLE = TRUE);"
                snow sql --role $SNOWFLAKE_ADMIN_ROLE -q "ALTER STAGE IF EXISTS ${CLONE_DB}.SYNAPSE_RAW.synapse_filehandles_stage REFRESH;"

            - name: Run schemachange on the clone as SNOWFLAKE_CLONE_ADMIN_ROLE
              shell: bash
              env:
                SNOWFLAKE_DEPLOY_DATABASE: ${{ steps.procure.outputs.clone_db }}
              run: |
                uv run --group schemachange --frozen --no-build schemachange \
                --connection-name default \
                --root-folder synapse_data_warehouse \
                --config-folder synapse_data_warehouse \
                --snowflake-role $SNOWFLAKE_CLONE_ADMIN_ROLE

            ########################################################################################################
            ########################################################################################################
            ##################################### RUNNING DBT ON THE CLONE ##########################################
            ########################################################################################################
            ########################################################################################################
            - name: Configure dbt
              uses: ./.github/actions/configure-dbt
              with:
                  PRIVATE_KEY_PASSPHRASE: ${{ secrets.ADMIN_SERVICE_PASS_PHRASE }}
                  PRIVATE_KEY: ${{ secrets.ADMIN_SERVICE_PRIVATE_KEY }}
                  ACCOUNT: ${{ secrets.SNOWSQL_ACCOUNT }}
                  USER: ${{ vars.ADMIN_SERVICE_USER }}
                  ROLE: ${{ env.SNOWFLAKE_CLONE_ADMIN_ROLE }}
                  DATABASE: ${{ steps.procure.outputs.clone_db }}
                  TARGET_NAME: clone

            - name: Run dbt models on the clone
              working-directory: transform
              shell: bash
              run: uv run --group dbt --frozen dbt run --selector synapse_data_warehouse --target clone --full-refresh

    drop_clone:
      runs-on: ubuntu-latest
      if: github.event.action == 'closed'
      environment: dev_restricted
      env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWSQL_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.ADMIN_SERVICE_USER }}
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.ADMIN_SERVICE_PASS_PHRASE }}
          SNOWFLAKE_DOMAIN_ORIGINAL: ${{ vars.SNOWFLAKE_SYNAPSE_DATA_WAREHOUSE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWSQL_WAREHOUSE }}

      steps:
          - uses: actions/checkout@v6

          - name: Configure Snowflake
            uses: ./.github/actions/configure-snowflake-cli
            with:
                PRIVATE_KEY_PASSPHRASE: ${{ secrets.ADMIN_SERVICE_PASS_PHRASE }}
                PRIVATE_KEY: ${{ secrets.ADMIN_SERVICE_PRIVATE_KEY }}
                ACCOUNT: ${{ secrets.SNOWSQL_ACCOUNT }}
                USER: ${{ vars.ADMIN_SERVICE_USER }}

          - name: Drop the clone and its proxy admin role
            shell: bash
            env:
              CLONE_SUFFIX: ${{ github.head_ref }}
            run: |
              uv run --package snowclone --frozen --no-build snowclone melt \
                --database "$SNOWFLAKE_DOMAIN_ORIGINAL" \
                --clone-suffix "$CLONE_SUFFIX"
